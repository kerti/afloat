# The remote half of the pre-push gate. `check` must mirror `make check` step
# for step (Makefile "workflow" section, docs/agents/dev.md): green locally ~
# green here, and a surface wired into one is wired into the other in the same
# commit. As backends land, they gain steps in `make check` — not jobs here.
#
# `migrations` and `conformance` are the exceptions, and deliberately so: both
# need docker and minutes, which is why `make check` leaves them out locally.
# CI has both, so nothing merges on an unproven schema, or on a backend that
# answers the contract's cases wrongly.
#
# Every action is pinned to a commit SHA: a tag like `v5` is mutable, and a
# compromised one runs with this workflow's token. The trailing `# vX.Y.Z`
# comment is what Dependabot reads and rewrites when it bumps the pin - keep it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (mirrors make check)
    runs-on: ubuntu-latest
    env:
      # The integration suite skips itself when docker is missing, which on a
      # runner that has docker would mean a green build that never ran
      # (backend/internal/testutil/db.go).
      AFLOAT_REQUIRE_TEST_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # The pinned version from the Makefile, so the lint gate is the same one
      # twice. check-go falls back to gofmt+vet when the binary is absent rather
      # than failing, so prove it is really on PATH before trusting the gate.
      - name: Install golangci-lint
        run: make lint-install

      - name: Verify golangci-lint is on PATH
        run: golangci-lint --version

      - run: make check

      # The profile is produced BY `make check` (make check-go writes
      # backend/coverage.out), so this step uploads what the gate already
      # measured rather than re-running the suite - the mirror stays one run,
      # not two.
      #
      # The token is an input, not step env: the action builds its own CLI
      # invocation and passes `-t` only from the input. fail_ci_if_error is on
      # because the default is to swallow an upload error, which is how a
      # missing token becomes a silent green - the failure mode this repo keeps
      # closing (#11, #12).
      #
      # Skipped for Dependabot: its pull requests run against a SEPARATE secret
      # store, so secrets.CODECOV_TOKEN is empty there unless it is added a
      # second time under Settings > Secrets > Dependabot. With
      # fail_ci_if_error on, not skipping would fail every dependency PR on an
      # upload rather than on the bump - and a dependency bump's coverage
      # measures nothing new.
      #
      # disable_search is not optional here. `files` adds to the CLI's file
      # list, it does not replace it: left searching, the step would also ship
      # any other coverage file it finds under the `backend-go` flag.
      - name: Upload Go coverage
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: backend/coverage.out
          disable_search: true
          flags: backend-go
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      # make check reports one line per surface and swallows the detail. On a
      # failure, re-run the parts that can fail, verbosely, so the log says what
      # broke instead of which target to run locally.
      - name: Diagnostics
        if: failure()
        run: |
          ./scripts/check-generated.sh || true
          ./scripts/check-env-docs.sh || true
          make check-go || true

  migrations:
    name: migrations (goose, real schema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # test-migrations runs goose via `go run`.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Ensure psql
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      # The SQL through goose: defaults, CHECKs, soft-delete indexes, cascades,
      # the §7.1 in-place edit, Down. A throwaway container of its own.
      - run: make test-migrations

  # The conformance harness (#28): the backend built and booted from this
  # commit, every case in contract/conformance/cases run against it, answers
  # and persisted rows asserted. scripts/conformance.sh owns the lifecycle and
  # sets AFLOAT_REQUIRE_CONFORMANCE=1, so a backend that never came up is a
  # failure here, not a skip.
  conformance:
    name: conformance (black-box suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            contract/conformance/go.sum

      # The script tails every backend's log itself when it fails.
      - run: make conformance

      - name: Postgres logs
        if: failure()
        run: docker compose logs --tail=50 postgres

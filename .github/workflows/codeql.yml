# Static analysis for the Go backend. Separate from ci.yml on purpose: ci.yml's
# `check` job mirrors `make check` step for step and nothing else belongs in it.
#
# Every action is pinned to a commit SHA; the trailing `# vX.Y.Z` comment is
# what Dependabot reads and rewrites. See ci.yml's header.
name: CodeQL

on:
  push:
    branches: [main]
  # No branches filter: the filter matches the PR's *base*, so `[main]` would
  # leave every PR into a long-lived branch unchecked - and step 6 showed this
  # repo does use them.
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (go)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # All three codeql-action entry points resolve to the same commit - one
      # repo, three actions.
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: go
          # Manual, not autobuild: autobuild looks for a build file at the
          # repository root and finds no backend, because it lives one
          # directory down. It would report "no build detected" rather than
          # fail, which is a green run that analysed nothing.
          build-mode: manual

      - run: cd backend && go build ./...

      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:go

# Static analysis for both backends. Separate from ci.yml on purpose: ci.yml's
# `check` job mirrors `make check` step for step and nothing else belongs in it.
#
# Every action is pinned to a commit SHA; the trailing `# vX.Y.Z` comment is
# what Dependabot reads and rewrites. See ci.yml's header.
name: CodeQL

on:
  push:
    branches: [main]
  # No branches filter: the filter matches the PR's *base*, so `[main]` would
  # leave every PR into a long-lived branch unchecked - and step 6 showed this
  # repo does use them.
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
          - language: java-kotlin

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both toolchains are set up conditionally rather than unconditionally:
      # each matrix job builds exactly one surface, and a JDK installed for the
      # Go job is a minute of nothing.
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # All three codeql-action entry points resolve to the same commit - one
      # repo, three actions.
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          # Manual, not autobuild: autobuild looks for a build file at the
          # repository root and finds neither backend, because both live one
          # directory down. It would report "no build detected" rather than
          # fail, which is a green run that analysed nothing.
          build-mode: manual

      - if: matrix.language == 'go'
        run: cd backend && go build ./...

      # `classes` and not `build`: the analysis needs compiled main output, and
      # `build` would additionally run the 269-spec Testcontainers suite that
      # ci.yml already runs.
      - if: matrix.language == 'java-kotlin'
        run: cd backend-kotlin && ./gradlew --console=plain classes

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}

# The Gradle daemon's heap. Unset, Gradle gives it 512 MiB, which is enough for
# the build but not for the build CodeQL traces: its Kotlin extractor forces
# the compiler in-process, into this daemon, and runs beside it. #58's Kotlin
# took that past 512 MiB and CodeQL's java-kotlin job died in compileKotlin with
# "GC overhead limit exceeded" after minutes of thrashing, while every other
# job compiled the same code in seconds. The Kotlin daemon inherits -Xmx from
# here too. Setting jvmargs replaces Gradle's defaults outright, so the
# metaspace cap is restated rather than lost. The test JVM's heap is separate:
# `maxHeapSize` in build.gradle.kts.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

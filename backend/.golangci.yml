# docs/adr/go/0004. `default: standard` is errcheck, govet, ineffassign,
# staticcheck and unused; revive adds the style rules go vet has no opinion on.
#
# Auth is the wrong code to ship unlinted: errcheck on a dropped error and
# staticcheck on a misused crypto/subtle comparison are exactly what review
# misses and a linter does not.
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - revive
  settings:
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
  exclusions:
    rules:
      # Generated code is the generator's business, not ours. It is never
      # hand-edited, so a finding here cannot be acted on.
      - path: '\.gen\.go$'
        linters: [revive, staticcheck, errcheck, unused, ineffassign, govet]
      - path: 'internal/db/'
        linters: [revive, staticcheck, errcheck, unused, ineffassign, govet]

formatters:
  enable:
    - gofmt
    - goimports

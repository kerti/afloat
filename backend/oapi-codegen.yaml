# Generates the Go server interface and types from contract/openapi.yaml, which
# is hand-written and authoritative (BOOTSTRAP.md §6). The output is committed
# and never hand-edited; `make check` regenerates and diffs.
#
# strict-server: handlers take a typed request and return a typed response, so a
# status the contract does not declare is a compile error rather than something
# a conformance test finds later (docs/adr/go/0001).
package: api
output: internal/api/api.gen.go
generate:
  chi-server: true
  strict-server: true
  models: true
  embedded-spec: true
output-options:
  skip-prune: true
  # format: email is checked once, by the spec-validating middleware
  # (httpserver/openapi_validate.go). The default openapi_types.Email runs a
  # second, different check in decode (net/mail on the untrimmed value) that
  # rejects a padded address the first one accepts, and Kotlin has no such type.
  type-mapping:
    string:
      formats:
        email:
          type: string

# Generates typed query methods from hand-written SQL (docs/adr/go/0002).
#
# The schema source is the canonical goose migrations (BOOTSTRAP.md §7); sqlc
# reads their Up sections and ignores Down. One schema source, and the
# generator reads it, so a column rename is a generation error rather than a
# runtime surprise.
version: "2"
sql:
  - engine: postgresql
    schema: "internal/migrations"
    queries: "queries"
    gen:
      go:
        package: db
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        emit_db_tags: false
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
        overrides:
          # DECIMAL(20,4) is money (BOOTSTRAP.md §4). pgtype.Numeric is awkward
          # to do arithmetic with and easy to serialise wrongly; shopspring is
          # what the trajectory calculation will need in step 9, and it
          # round-trips to a string rather than a float.
          # Both overrides spell the import the same way (the struct form):
          # sqlc emits one import line per spelling, so the string form beside
          # the struct form is two imports of one package and does not compile
          # once a model has both a numeric and a nullable numeric column.
          - db_type: "pg_catalog.numeric"
            go_type:
              import: "github.com/shopspring/decimal"
              package: "decimal"
              type: "Decimal"
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type:
              import: "github.com/shopspring/decimal"
              package: "decimal"
              type: "NullDecimal"

# Generates typed query methods from hand-written SQL (docs/adr/go/0002).
#
# The schema source is db/migrations — the CANONICAL Flyway-native files, not
# the generated goose ones (BOOTSTRAP.md §7). One schema source, and the
# generator reads it, so a column rename is a generation error rather than a
# runtime surprise.
version: "2"
sql:
  - engine: postgresql
    schema: "../db/migrations"
    queries: "queries"
    gen:
      go:
        package: db
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        emit_db_tags: false
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
        overrides:
          # DECIMAL(20,4) is money (BOOTSTRAP.md §4). pgtype.Numeric is awkward
          # to do arithmetic with and easy to serialise wrongly; shopspring is
          # what the trajectory calculation will need in step 9, and it
          # round-trips to a string rather than a float.
          - db_type: "pg_catalog.numeric"
            go_type: "github.com/shopspring/decimal.Decimal"
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type:
              import: "github.com/shopspring/decimal"
              package: "decimal"
              type: "NullDecimal"

# AUTH_LOCAL_ENABLED=false (#24): the local login route answers exactly like a
# path that was never registered, on every method, so a prober cannot tell it
# exists. Run against the local-disabled server scripts/conformance.sh boots.
#
# What "exactly like" means is a relation, not bytes: the body and
# Content-Type are pinned by `same_as` against the server's own answer for
# /no-such-route, so the frontend acts on a non-envelope 404's status alone.

- name: local login disabled - POST is an unregistered-path 404
  issue: "24"
  profile: local-disabled
  request:
    method: POST
    path: /auth/local/login
    headers:
      Content-Type: application/json
    body: '{"email":"nobody@example.com","password":"correct horse battery staple"}'
  expect:
    status: 404
    same_as:
      method: POST
      path: /no-such-route
      headers:
        Content-Type: application/json
      body: '{"email":"nobody@example.com","password":"correct horse battery staple"}'
    rows:
      - sql: SELECT (SELECT count(*) FROM sessions)::int AS sessions, (SELECT count(*) FROM login_attempts)::int AS attempts
        rows: [{sessions: 0, attempts: 0}]

# The 405 case. A gate keyed on POST leaves the router to answer GET with 405
# Method Not Allowed, which says the route exists - the disclosure the 404 is
# there to prevent (Go #47).
- name: local login disabled - GET is an unregistered-path 404, not a 405
  issue: "24"
  profile: local-disabled
  request:
    method: GET
    path: /auth/local/login
  expect:
    status: 404
    same_as:
      method: GET
      path: /no-such-route

# One flag, two readers: the gate and /auth/methods read the same value, so the
# client is never told a provider exists that then 404s. Also proves the pair
# really booted with local off - the two cases above would pass against a
# backend that 404s everything.
- name: local login disabled - auth methods reports local off
  issue: "24"
  profile: local-disabled
  request:
    method: GET
    path: /auth/methods
  expect:
    status: 200
    body_json:
      local: false
      google: true
      founding_open: true

# #56 made a percent-encoded path its decoded route, so an encoded spelling of
# the login path IS the login path, and the gate must hold on every spelling:
# a gate that compared the still-encoded request URI while the router used the
# decoded one would let POST /api/auth/local/%6Cogin sign a user in with local
# login off. The seeded password is correct, so any answer but the 404 means the
# gate did not hold; the rows prove no session was written.
- name: local login disabled - an encoded spelling of the path is gated too
  issue: "56"
  profile: local-disabled
  request:
    method: POST
    path: /auth/local/%6Cogin
    headers:
      Content-Type: application/json
    body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
  expect:
    status: 404
    same_as: &no-such-login-post
      method: POST
      path: /no-such-route
      headers:
        Content-Type: application/json
      body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
    rows: &no-session
      - sql: SELECT count(*)::int AS n FROM sessions
        rows: [{n: 0}]

- name: local login disabled - an encoded letter anywhere in the path is gated
  issue: "56"
  profile: local-disabled
  request:
    method: POST
    path: /auth/local/l%6Fgin
    headers:
      Content-Type: application/json
    body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
  expect:
    status: 404
    same_as: *no-such-login-post
    rows: *no-session

# "On every method" includes one chi has never heard of: it answers chi's own
# 405, which is also what an unregistered path answers to it, so the gate
# still cannot be told apart from a missing route.
- name: local login disabled - an unknown method answers like an unregistered path
  issue: "24"
  profile: local-disabled
  request:
    method: BREW
    path: /auth/local/login
  expect:
    status: 405
    same_as:
      method: BREW
      path: /no-such-route
    rows: *no-session

# Registration is the local provider's second route (#108), behind the same gate:
# with local off, a person cannot open a handshake, so the onboarding gate has
# nothing to honour. Each case writes nothing - no handshake, no backoff row.
- name: local register disabled - POST is an unregistered-path 404
  issue: "108"
  profile: local-disabled
  request:
    method: POST
    path: /auth/local/register
    headers:
      Content-Type: application/json
    body: '{"email":"new@example.com","password":"kucing oranye di atap"}'
  expect:
    status: 404
    same_as:
      method: POST
      path: /no-such-route
      headers:
        Content-Type: application/json
      body: '{"email":"new@example.com","password":"kucing oranye di atap"}'
    cookies: {}
    rows: &nothing-opened
      - sql: SELECT (SELECT count(*) FROM onboarding_handshakes)::int AS handshakes, (SELECT count(*) FROM login_attempts)::int AS attempts
        rows: [{handshakes: 0, attempts: 0}]

- name: local register disabled - GET is an unregistered-path 404, not a 405
  issue: "108"
  profile: local-disabled
  request:
    method: GET
    path: /auth/local/register
  expect:
    status: 404
    same_as:
      method: GET
      path: /no-such-route

- name: local register disabled - an encoded spelling of the path is gated too
  issue: "108"
  profile: local-disabled
  request:
    method: POST
    path: /auth/local/r%65gister
    headers:
      Content-Type: application/json
    body: '{"email":"new@example.com","password":"kucing oranye di atap"}'
  expect:
    status: 404
    same_as:
      method: POST
      path: /no-such-route
      headers:
        Content-Type: application/json
      body: '{"email":"new@example.com","password":"kucing oranye di atap"}'
    rows: *nothing-opened

# HEAD's framing is decided after the handler returns, so a ResponseRecorder
# cannot show it: the gate's 404 once carried a Content-Length that an
# unregistered path's lacks. The harness is a live client.
- name: local register disabled - HEAD is an unregistered-path 404
  issue: "108"
  profile: local-disabled
  request:
    method: HEAD
    path: /auth/local/register
  expect:
    status: 404
    same_as:
      method: HEAD
      path: /no-such-route

- name: local register disabled - an unknown method answers like an unregistered path
  issue: "108"
  profile: local-disabled
  request:
    method: BREW
    path: /auth/local/register
  expect:
    status: 405
    same_as:
      method: BREW
      path: /no-such-route
    rows: *nothing-opened

# The gate holds nothing else back: with local off the onboarding routes still
# exist (a later provider arrives at them) and answer a request with no
# handshake as they always do.
- name: local register disabled - the onboarding gate still exists and answers 401
  issue: "108"
  profile: local-disabled
  request:
    method: GET
    path: /onboarding/options
  expect:
    status: 401
    body_json: {code: UNAUTHORIZED}
    cookies: {}

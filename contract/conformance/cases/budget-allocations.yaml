# PATCH /budget's `allocations` (#130, PR 3 of 4): what Categories are planned at,
# in the CURRENT Budget Period only (R1, R2: earlier Periods keep what they held,
# nothing is applied "from now on"). An allocation is a version dated Today, the
# writer's Period Day (CONTEXT.md §Mid-period Budget changes): the same day
# overwrites, and the answer is the whole Budget with its figures recomputed on
# the server. `null` means none and is allowed for a Daily Category only: a
# Commitment always has an allocation (PRD S8, R10), and "0" is an allocation.
# What can be refused is refused before anything is written, so a refused request
# does not even materialise a Period. The seed is one Household with
# period_start_day 1 and day_starts_at 04:00, and Alice's time zone is
# Asia/Jakarta, so state is built and asserted relative to the database's clock,
# as budget.yaml; the exact-date assertions live in the backend's suite, which
# injects a clock. Money spelling: budget-money.yaml covers the Monthly Budget;
# the amount of an allocation is the same MoneyInput, and its table is here.
#
# The Categories a case starts with (the ids of categories-update.yaml):
#   0192f0a0-0000-7000-8003-000000000001  Rent       commitment  active
#   0192f0a0-0000-7000-8003-000000000002  Groceries  daily       active
#   0192f0a0-0000-7000-8003-000000000003  Gym        commitment  inactive
#   0192f0a0-0000-7000-8003-000000000004  Typo       daily       deleted
#   0192f0a0-0000-7000-8003-000000000009  Theirs     commitment  Household 2


- name: "budget allocations - a change is a version dated Today in the current Period, and the answer is the whole Budget"
  issue: "130"
  given: &planned
    - sql: |
        INSERT INTO households (id, household_display_name) VALUES ('0192f0a0-0000-7000-8000-000000000002', 'Other Household');
        INSERT INTO categories (id, household_id, category_display_name, bucket, active, deleted_at, created_at) VALUES
          ('0192f0a0-0000-7000-8003-000000000001',   '0192f0a0-0000-7000-8000-000000000001', 'Rent',      'commitment', true,  NULL,  '2026-01-01T00:00:00Z'),
          ('0192f0a0-0000-7000-8003-000000000002',   '0192f0a0-0000-7000-8000-000000000001', 'Groceries', 'daily',      true,  NULL,  '2026-01-02T00:00:00Z'),
          ('0192f0a0-0000-7000-8003-000000000003',    '0192f0a0-0000-7000-8000-000000000001', 'Gym',       'commitment', false, NULL,  '2026-01-03T00:00:00Z'),
          ('0192f0a0-0000-7000-8003-000000000004',   '0192f0a0-0000-7000-8000-000000000001', 'Typo',      'daily',      true,  now(), '2026-01-04T00:00:00Z'),
          ('0192f0a0-0000-7000-8003-000000000009', '0192f0a0-0000-7000-8000-000000000002', 'Theirs',    'commitment', true,  NULL,  '2026-01-05T00:00:00Z')
        ;
        INSERT INTO budgets (household_id, year_month) VALUES ('0192f0a0-0000-7000-8000-000000000001', to_char((now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours', 'YYYY-MM'));
        INSERT INTO monthly_budgets (household_id, year_month, effective_on, monthly_budget) VALUES ('0192f0a0-0000-7000-8000-000000000001', to_char((now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours', 'YYYY-MM'), ((now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours')::date, 9000000);
        INSERT INTO allocations (household_id, year_month, effective_on, category_id, allocation) VALUES
          ('0192f0a0-0000-7000-8000-000000000001', to_char((now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours', 'YYYY-MM'), ((now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours')::date, '0192f0a0-0000-7000-8003-000000000001', 3000000),
          ('0192f0a0-0000-7000-8000-000000000001', to_char((now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours', 'YYYY-MM'), ((now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours')::date, '0192f0a0-0000-7000-8003-000000000002', 2000000)
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request:
    method: PATCH
    path: /budget
    headers:
      Content-Type: application/json
    body: '{"allocations":[{"category_id":"0192f0a0-0000-7000-8003-000000000001","allocation":"3500000"},{"category_id":"0192f0a0-0000-7000-8003-000000000002","allocation":"1500000.5"}]}'
  expect:
    status: 200
    body_json: {"period": {"year_month": "<re:[0-9]{4}-[0-9]{2}>", "starts_on": "<re:[0-9]{4}-[0-9]{2}-01>", "ends_on": "<re:[0-9]{4}-[0-9]{2}-(28|29|30|31)>"}, "allocations": [{"category_id": "0192f0a0-0000-7000-8003-000000000001", "allocation": "3500000.0000"}, {"category_id": "0192f0a0-0000-7000-8003-000000000002", "allocation": "1500000.5000"}], "commitments_budget": "3500000.0000", "monthly_budget": "9000000.0000", "daily_pool": "5500000.0000", "unallocated": "3999999.5000"}
    cookies: {}
    rows:
      - sql: SELECT category_id::text AS category_id, year_month = to_char((now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours', 'YYYY-MM') AS in_period, effective_on = ((now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours')::date AS dated_today, allocation::text AS amount FROM allocations ORDER BY category_id
        rows: [{"category_id": "0192f0a0-0000-7000-8003-000000000001", "in_period": true, "dated_today": true, "amount": "3500000.0000"}, {"category_id": "0192f0a0-0000-7000-8003-000000000002", "in_period": true, "dated_today": true, "amount": "1500000.5000"}]
      - sql: SELECT (SELECT count(*) FROM budgets)::int AS budgets, (SELECT count(*) FROM monthly_budgets)::int AS versions, (SELECT count(*) FROM allocations)::int AS allocations
        rows: [{"budgets": 1, "versions": 1, "allocations": 2}]



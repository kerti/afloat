# The money spelling table for PATCH /budget (#130 C10, BOOTSTRAP.md §4).
#
# A request amount is a `MoneyInput`: an unsigned decimal string, at most 16
# integer digits and 4 decimals, no sign, exponent, separator or whitespace. More
# than four decimals is refused and never rounded. Every refusal is a 400 that
# writes nothing, not even the Period's marker: the contract's rule runs before
# the handler does. A JSON number is not a string at all, so it is
# INVALID_JSON_BODY like any wrong type, and so is `null` (no coercion, and a
# Monthly Budget cannot be cleared).
#
# The accepted spellings are answered below, and the first Monthly Budget, the
# overwrite and the carry-forward are in budget.yaml.

- name: "budget money - a PATCH with exponent notation, as a string is refused"
  issue: "130"
  given: &signed-in
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request:
    method: PATCH
    path: /budget
    headers:
      Content-Type: application/json
    body: '{"monthly_budget":"9e6"}'
  expect:
    status: 400
    body_json: {code: VALIDATION, args: {field: monthly_budget, rule: pattern}}
    cookies: {}
    rows:
      - sql: SELECT (SELECT count(*) FROM budgets)::int AS budgets, (SELECT count(*) FROM monthly_budgets)::int AS versions
        rows: [{budgets: 0, versions: 0}]


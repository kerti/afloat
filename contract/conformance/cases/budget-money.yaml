- name: "budget money - 0 is answered and stored as 0.0000"
  issue: "130"
  given: *signed-in
  request:
    method: PATCH
    path: /budget
    headers:
      Content-Type: application/json
    body: '{"monthly_budget":"0"}'
  expect:
    status: 200
    body_json:
      period:
        year_month: "<re:[0-9]{4}-[0-9]{2}>"
        starts_on: "<re:[0-9]{4}-[0-9]{2}-01>"
        ends_on: "<re:[0-9]{4}-[0-9]{2}-(28|29|30|31)>"
      monthly_budget: "0.0000"
      daily_pool: "0.0000"
      unallocated: "0.0000"
      allocations: []
      commitments_budget: "0.0000"
    cookies: {}
    rows:
      - sql: SELECT monthly_budget::text AS amount FROM monthly_budgets
        rows: [{amount: "0.0000"}]


# Tenancy. The other Household holds the same label with a different amount: the
# caller reads and writes only its own, and its own copy never comes from theirs.
- name: budget - another Household's Budget is invisible to a read and untouched by a change
  issue: "130"
  given:
    - sql: |
        INSERT INTO households (id, household_display_name) VALUES ('0192f0a0-0000-7000-8000-000000000002', 'Other Household');
        INSERT INTO budgets (household_id, year_month, created_at) VALUES
          ('0192f0a0-0000-7000-8000-000000000002', to_char((now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours', 'YYYY-MM'), '2000-01-01T00:00:00Z');
        INSERT INTO monthly_budgets (household_id, year_month, effective_on, monthly_budget, updated_at) VALUES
          ('0192f0a0-0000-7000-8000-000000000002', to_char((now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours', 'YYYY-MM'),
           ((now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours')::date, 1234567, '2000-01-01T00:00:00Z')
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request:
    method: GET
    path: /budget
  expect:
    status: 200
    body_json:
      period: *period
      allocations: []
      commitments_budget: "0.0000"
    cookies: {}
    rows:
      - sql: |
          SELECT household_id::text AS household, created_at > now() - interval '1 minute' AS made_just_now
          FROM budgets ORDER BY household_id
        rows:
          - {household: 0192f0a0-0000-7000-8000-000000000001, made_just_now: true}
          - {household: 0192f0a0-0000-7000-8000-000000000002, made_just_now: false}
      - sql: SELECT household_id::text AS household, monthly_budget::text AS amount, to_char(updated_at, 'YYYY') AS updated FROM monthly_budgets
        rows: [{household: 0192f0a0-0000-7000-8000-000000000002, amount: "1234567.0000", updated: "2000"}]


# #113 D1: the window is derived from the Household's period_start_day every time.
- name: budget - the window follows the Household's period_start_day
  issue: "130"
  given:
    - sql: UPDATE households SET period_start_day = 28
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request:
    method: GET
    path: /budget
  expect:
    status: 200
    body_json:
      period:
        year_month: "<re:[0-9]{4}-[0-9]{2}>"
        starts_on: "<re:[0-9]{4}-[0-9]{2}-28>"
        ends_on: "<re:[0-9]{4}-[0-9]{2}-27>"
      allocations: []
      commitments_budget: "0.0000"
    cookies: {}
    rows:
      - sql: |
          SELECT year_month = CASE WHEN extract(day FROM (now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours')::int >= 28
                                   THEN to_char((now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours', 'YYYY-MM')
                                   ELSE to_char(date_trunc('month', (now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours') - interval '1 month', 'YYYY-MM')
                              END AS right_label
          FROM budgets
        rows: [{right_label: true}]


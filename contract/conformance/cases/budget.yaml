# S12, S13: carried forward on the first read of a Period, dated its first day,
# from the latest version of the nearest earlier Period that has a Monthly Budget.
- name: budget - a new Period carries the latest Monthly Budget forward, dated its first day
  issue: "130"
  given:
    - sql: |
        INSERT INTO budgets (household_id, year_month) VALUES
          ('0192f0a0-0000-7000-8000-000000000001', to_char(date_trunc('month', (now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours') - interval '1 month', 'YYYY-MM'));
        INSERT INTO monthly_budgets (household_id, year_month, effective_on, monthly_budget) VALUES
          ('0192f0a0-0000-7000-8000-000000000001', to_char(date_trunc('month', (now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours') - interval '1 month', 'YYYY-MM'),
           (date_trunc('month', (now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours') - interval '1 month')::date, 6000000),
          ('0192f0a0-0000-7000-8000-000000000001', to_char(date_trunc('month', (now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours') - interval '1 month', 'YYYY-MM'),
           (date_trunc('month', (now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours') - interval '1 month')::date + 10, 7500000)
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request:
    method: GET
    path: /budget
  expect:
    status: 200
    body_json:
      period: *period
      monthly_budget: "7500000.0000"
      daily_pool: "7500000.0000"
      unallocated: "7500000.0000"
      allocations: []
      commitments_budget: "0.0000"
    cookies: {}
    rows:
      - sql: |
          SELECT year_month = to_char((now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours', 'YYYY-MM') AS current_period,
                 effective_on = date_trunc('month', (now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours')::date AS first_day,
                 monthly_budget::text AS amount
          FROM monthly_budgets
          WHERE year_month = to_char((now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours', 'YYYY-MM')
        rows: [{current_period: true, first_day: true, amount: "7500000.0000"}]
      - sql: |
          SELECT count(*)::int AS n FROM monthly_budgets
          WHERE year_month = to_char(date_trunc('month', (now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours') - interval '1 month', 'YYYY-MM')
        rows: [{n: 2}]
      - sql: SELECT count(*)::int AS n FROM budgets
        rows: [{n: 2}]


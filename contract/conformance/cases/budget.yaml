# GET and PATCH /budget (#130, PR 1): the first money on the wire and the first
# Period Day arithmetic. The Budget is always the current Budget Period's, for
# the caller's own Household, and a read may write once per Period (S13, Q-09).
#
# The seed is one Household with period_start_day 1 and day_starts_at 04:00, and
# Alice's time zone is Asia/Jakarta, so Today is the Postgres clock in Jakarta
# less four hours:
#
#   Today  = ((now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours')::date
#   Period = to_char(that, 'YYYY-MM')
#
# A case builds its state from that clock and asserts the rows relative to it,
# never a literal date, and the answer's own dates are matched by `<re:...>`; the
# rest of the body is still compared exactly. A case that straddles a Period
# boundary or 04:00 Jakarta could flake, so the exact-date assertions live in the
# backend's own suite, which injects a clock.
#
# `rows:` read the columns, because a response can be right while the row behind
# it is not. The money spelling table is budget-money.yaml.

- name: budget - a first read materialises the Period and has no Monthly Budget
  issue: "130"
  given: &signed-in
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request:
    method: GET
    path: /budget
  expect:
    status: 200
    headers:
      Content-Type: application/json
    body_json:
      period: &period
        year_month: "<re:[0-9]{4}-[0-9]{2}>"
        starts_on: "<re:[0-9]{4}-[0-9]{2}-01>"
        ends_on: "<re:[0-9]{4}-[0-9]{2}-(28|29|30|31)>"
      allocations: []
      commitments_budget: "0.0000"
    cookies: {}
    rows:
      - sql: |
          SELECT (SELECT count(*) FROM budgets WHERE household_id = '0192f0a0-0000-7000-8000-000000000001'
                    AND year_month = to_char((now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours', 'YYYY-MM'))::int AS in_period,
                 (SELECT count(*) FROM budgets)::int AS budgets,
                 (SELECT count(*) FROM monthly_budgets)::int AS versions
        rows: [{in_period: 1, budgets: 1, versions: 0}]

- name: budget - a read of a Period that exists writes nothing
  issue: "130"
  given:
    - sql: |
        INSERT INTO budgets (household_id, year_month, created_at) VALUES
          ('0192f0a0-0000-7000-8000-000000000001', to_char((now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours', 'YYYY-MM'), '2000-01-01T00:00:00Z');
        INSERT INTO monthly_budgets (household_id, year_month, effective_on, monthly_budget, updated_at) VALUES
          ('0192f0a0-0000-7000-8000-000000000001', to_char((now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours', 'YYYY-MM'),
           ((now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours')::date, 6000000, '2000-01-01T00:00:00Z')
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request:
    method: GET
    path: /budget
  expect:
    status: 200
    body_json:
      period: *period
      monthly_budget: "6000000.0000"
      daily_pool: "6000000.0000"
      unallocated: "6000000.0000"
      allocations: []
      commitments_budget: "0.0000"
    cookies: {}
    rows:
      - sql: |
          SELECT to_char(b.created_at, 'YYYY') AS marker_year, to_char(m.updated_at, 'YYYY') AS version_year,
                 (SELECT count(*) FROM budgets)::int AS budgets, (SELECT count(*) FROM monthly_budgets)::int AS versions
          FROM budgets b, monthly_budgets m
        rows: [{marker_year: "2000", version_year: "2000", budgets: 1, versions: 1}]


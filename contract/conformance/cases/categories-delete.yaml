# DELETE /categories/{id} (#130, PR 4 of 5): a soft delete. The row stays with
# deleted_at set; the Category is gone from the list and from PATCH, gives up its
# name at once, and drops out of every figure of the current Budget Period (reads
# join live Categories) without one allocation row being touched. Idempotent on
# the caller's own Category, keeping the FIRST deleted_at, and never refused once
# deleted. An id that is unknown or another Household's is one 404 NOT_FOUND, byte
# for byte; the id's shape is checked before the lookup.
#
# 409 CATEGORY_IN_USE (C8, R9): refused while the Category holds an allocation, a
# non-null amount, in a Budget Period OTHER than the current one (earlier or later).
# Only the current Period's own allocation never blocks, and a Period that holds
# only a "none" row does not. Under an outage the session itself cannot be read,
# which the session middleware answers 500 with the cookie left alone (#27); it
# never reaches the handler, whose own 500s the backend's suite covers.
#
# The Categories a case starts with, in the current Period (dated Today by the
# database's own clock in Jakarta less four hours, as budget.yaml), the Monthly
# Budget being 9.000.000. Every row is created 2026-01-NN and updated at one
# fixed instant, and a deleted one's deleted_at is that instant too, so `untouched`
# and `stamp_kept` say whether a request moved either:
#   ...8003-000000000001  Rent           commitment  active    this Period 3.000.000 (only)
#   ...8003-000000000002  Groceries      daily       active    this Period 2.000.000
#   ...8003-000000000003  Gym            commitment  inactive  this Period 500.000 AND last Period 400.000
#   ...8003-000000000004  Typo           daily       deleted   none
#   ...8003-000000000005  Subscriptions  daily       active    none
#   ...8003-000000000006  Old            daily       active    last Period 100, cleared to none a day later
#   ...8003-000000000007  Spare          daily       active    last Period: only a none row
#   ...8003-000000000008  Dormant        daily       inactive  none
#   ...8003-000000000009  Theirs         commitment  Household 2, this Period 1.000.000
#   ...8003-000000000010  Future         commitment  active    NEXT Period 700.000 (a later Period counts as another)
# The allocations never change in any case: every row asserts all of them.


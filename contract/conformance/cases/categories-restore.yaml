# POST /categories/{id}/restore (#130, PR 4 of 5): the Undo of DELETE. It clears
# deleted_at and answers the Category, `active` as it was. Idempotent (a live
# Category is 200, unchanged). A name that another Category of the Household that
# is not deleted now holds, in either bucket and any case, active or inactive, is
# 409 NAME_TAKEN with the Category still deleted; another Household's Category
# does not hold it. An id that is unknown or another Household's is one 404
# NOT_FOUND, byte for byte.
#
# Undo is "as if it was never deleted" (the maintainer's ruling on a restore).
# Within the Period the Category was deleted in its rows were never touched, so the
# figures come back exactly and nothing is written (Rent). A Period first read while
# it was deleted did not carry it forward, so the restore carries it: its latest
# non-null allocation from the nearest earlier Period that holds one for it, dated
# this Period's first day (Housing, Cinema). A Daily Category whose latest state was
# "none" (Books), or that never had an allocation (Never), gets none. A Period
# nobody has read yet is brought into being by the restore, as a first read does.
# Under an outage the session itself cannot be read, which the session middleware
# answers 500 with the cookie left alone (#27).
#
# The Categories a case starts with (every row created 2026-01-NN, updated at one
# fixed instant, a deleted one's deleted_at that instant too; allocations are in
# the current Period unless said, dated Today by the database's clock as in
# budget.yaml; the Monthly Budget is 9.000.000):
#   ...8003-000000000001  Rent      commitment  deleted   this Period 3.000.000
#   ...8003-000000000002  Groceries daily       live      this Period 2.000.000
#   ...8003-000000000003  Gym       commitment  deleted, inactive   this Period 500.000
#   ...8003-000000000004  Housing   commitment  deleted   LAST Period 2.900.000 only (this Period's copy skipped it)
#   ...8003-000000000005  Phone     commitment  deleted   this Period 100.000
#   ...8003-000000000006  phone     daily       live      (holds Phone's name)
#   ...8003-000000000007  Pool      daily       deleted
#   ...8003-000000000008  POOL      daily       live, inactive (holds Pool's name)
#   ...8003-000000000009  Zed       daily       deleted   (Household 2's live Zed does not hold it)
#   ...8003-000000000010  Zed       daily       Household 2, live
#   ...8003-000000000011  Gone      commitment  Household 2, deleted
#   ...8003-000000000012  Theirs    commitment  Household 2, live, this Period 1.000.000
#   ...8003-000000000013  Cinema    daily       deleted   LAST Period 800
#   ...8003-000000000014  Books     daily       deleted   LAST Period 500, cleared to none a day later
#   ...8003-000000000015  Never     daily       deleted   none ever
# The allocations never change in any case: every row asserts all of them.


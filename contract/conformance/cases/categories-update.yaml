# PATCH /categories/{id} (#130, PR 3 of 4): rename, deactivate and reactivate a
# Category. Merge semantics as PATCH /pockets/{id} (BOOTSTRAP.md §4): a property
# left out is unchanged, `{}` is a valid no-op, an unknown property is
# INVALID_JSON_BODY, the answer is the whole Category. `bucket` is fixed at
# creation, so it is not a property of the request. What a Category is planned at
# is the Budget's, so no rename or deactivation touches an allocation: the `rows:`
# of every case read the allocations too, and the Budget's figures cannot move.
# Names are unique across both buckets, active or inactive, never deleted ones
# (409 NAME_TAKEN). An id that is unknown, another Household's or deleted is one
# 404 NOT_FOUND, the same bytes, for every body; validation comes before the
# lookup. Only ASCII case folding is pinned: lower() follows the database's locale.
#
# The Categories a case starts with, and the Budget they are in (the Household's
# Monthly Budget 9.000.000, the current Period, dated Today by the database's own
# clock in Jakarta less four hours, as budget.yaml):
#   0192f0a0-0000-7000-8003-000000000001  Rent       commitment  active    allocated 3.000.000
#   0192f0a0-0000-7000-8003-000000000002  Groceries  daily       active    allocated 2.000.000
#   0192f0a0-0000-7000-8003-000000000003  Gym        commitment  inactive  allocated 500.000
#   0192f0a0-0000-7000-8003-000000000004  Typo       daily       deleted
#   0192f0a0-0000-7000-8003-000000000009  Theirs     commitment  Household 2
#
# Under an outage the session itself cannot be read, which the session middleware
# answers 500 with the cookie left alone (#27); it never reaches the handler,
# whose own 500s the backend's suite covers.



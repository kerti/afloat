  issue: "130"
  given: &seeded
    - sql: |
        INSERT INTO households (id, household_display_name) VALUES ('0192f0a0-0000-7000-8000-000000000002', 'Other Household');
        INSERT INTO categories (id, household_id, category_display_name, bucket, active, deleted_at, created_at) VALUES
          ('0192f0a0-0000-7000-8003-000000000001',   '0192f0a0-0000-7000-8000-000000000001', 'Rent',      'commitment', true,  NULL,  '2026-01-01T00:00:00Z'),
          ('0192f0a0-0000-7000-8003-000000000002',   '0192f0a0-0000-7000-8000-000000000001', 'Groceries', 'daily',      true,  NULL,  '2026-01-02T00:00:00Z'),
          ('0192f0a0-0000-7000-8003-000000000003',    '0192f0a0-0000-7000-8000-000000000001', 'Gym',       'commitment', false, NULL,  '2026-01-03T00:00:00Z'),
          ('0192f0a0-0000-7000-8003-000000000004',   '0192f0a0-0000-7000-8000-000000000001', 'Typo',      'daily',      true,  now(), '2026-01-04T00:00:00Z'),
          ('0192f0a0-0000-7000-8003-000000000009', '0192f0a0-0000-7000-8000-000000000002', 'Theirs',    'commitment', true,  NULL,  '2026-01-05T00:00:00Z');
        INSERT INTO budgets (household_id, year_month) VALUES ('0192f0a0-0000-7000-8000-000000000001', to_char((now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours', 'YYYY-MM'));
        INSERT INTO monthly_budgets (household_id, year_month, effective_on, monthly_budget) VALUES ('0192f0a0-0000-7000-8000-000000000001', to_char((now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours', 'YYYY-MM'), ((now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours')::date, 9000000);
        INSERT INTO allocations (household_id, year_month, effective_on, category_id, allocation) VALUES
          ('0192f0a0-0000-7000-8000-000000000001', to_char((now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours', 'YYYY-MM'), ((now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours')::date, '0192f0a0-0000-7000-8003-000000000001', 3000000),
          ('0192f0a0-0000-7000-8000-000000000001', to_char((now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours', 'YYYY-MM'), ((now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours')::date, '0192f0a0-0000-7000-8003-000000000002', 2000000),
          ('0192f0a0-0000-7000-8000-000000000001', to_char((now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours', 'YYYY-MM'), ((now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours')::date, '0192f0a0-0000-7000-8003-000000000003', 500000)
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request:
    method: PATCH
    path: /categories/0192f0a0-0000-7000-8003-000000000001
    headers:
      Content-Type: application/json
    body: '{"category_display_name":"Housing"}'
  expect:
    status: 200
    body_json: {"id": "0192f0a0-0000-7000-8003-000000000001", "category_display_name": "Housing", "bucket": "commitment", "active": true}
    cookies: {}
    rows:
      - sql: SELECT id::text AS id, household_id::text AS household_id, category_display_name AS name, bucket, active, (deleted_at IS NOT NULL) AS deleted FROM categories ORDER BY id
        rows: [{"id": "0192f0a0-0000-7000-8003-000000000001", "household_id": "0192f0a0-0000-7000-8000-000000000001", "name": "Housing", "bucket": "commitment", "active": true, "deleted": false}, {"id": "0192f0a0-0000-7000-8003-000000000002", "household_id": "0192f0a0-0000-7000-8000-000000000001", "name": "Groceries", "bucket": "daily", "active": true, "deleted": false}, {"id": "0192f0a0-0000-7000-8003-000000000003", "household_id": "0192f0a0-0000-7000-8000-000000000001", "name": "Gym", "bucket": "commitment", "active": false, "deleted": false}, {"id": "0192f0a0-0000-7000-8003-000000000004", "household_id": "0192f0a0-0000-7000-8000-000000000001", "name": "Typo", "bucket": "daily", "active": true, "deleted": true}, {"id": "0192f0a0-0000-7000-8003-000000000009", "household_id": "0192f0a0-0000-7000-8000-000000000002", "name": "Theirs", "bucket": "commitment", "active": true, "deleted": false}]
      - sql: SELECT category_id::text AS category_id, allocation::text AS amount, effective_on = ((now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours')::date AS dated_today FROM allocations ORDER BY category_id
        rows: [{"category_id": "0192f0a0-0000-7000-8003-000000000001", "amount": "3000000.0000", "dated_today": true}, {"category_id": "0192f0a0-0000-7000-8003-000000000002", "amount": "2000000.0000", "dated_today": true}, {"category_id": "0192f0a0-0000-7000-8003-000000000003", "amount": "500000.0000", "dated_today": true}]



# GET and POST /categories (#130, PR 2): the second domain entity, copying
# Pockets' conventions (BOOTSTRAP.md §4): the client-supplied UUIDv7 is the
# idempotency key (201 first, 200 for a replay of a live Category of the
# Household, the STORED row, the rest of the body neither compared nor applied,
# the allocation included), an id held by something else is 409 ID_TAKEN (another
# Household's or the caller's own deleted one, one answer), and a name already
# held by a Category that is not deleted is 409 NAME_TAKEN, whatever the bucket
# (inactive Categories still hold theirs).
#
# What a Category is planned at is the Budget's, per Period (PRD S8): a create
# may carry an `allocation`, required for a Commitment, written in the same
# transaction to the current Period's Budget, dated Today, and bringing the
# Period into being if this is the first request to find it missing (S13). The
# seed is one Household with period_start_day 1 and day_starts_at 04:00, and
# Alice's time zone is Asia/Jakarta, so Today is the Postgres clock in Jakarta
# less four hours; a case asserts the allocation's Period and date relative to it
# (`in_period`, `dated_today`), never as a literal, and the exact-date assertions
# live in the backend's suite, which injects a clock.
#
# The Household is always the session's, never the body's. fixtures/seed.sql holds
# one; a case that proves another is untouched adds a second in `given:`. `rows:`
# read the columns, because a response can be right while the row behind it is not.
#
# Only ASCII case folding is pinned (Rent/rent): lower() follows the database's
# locale, so a non-ASCII row would pass on one host and fail on another.
#
# Under an outage the session itself cannot be read, which the session middleware
# answers 500 with the cookie left alone (#27); it never reaches the handler,
# whose own 500s the backend's suite covers.
#
# The Categories a case starts with, inserted in `given:`. Fixed ids
# 0192f0a0-0000-7000-8003-00000000000N.

- name: "categories - an empty Household lists items, not null"
  issue: "130"
  given:
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request:
    method: GET
    path: /categories
  expect:
    status: 200
    body_json: {"items": []}
    cookies: {}
    rows:
      - sql: SELECT id::text AS id, household_id::text AS household_id, category_display_name AS name, bucket, active, (deleted_at IS NOT NULL) AS deleted FROM categories ORDER BY id
        rows: []

- name: "categories - the list is in creation order, both buckets together, inactive ones included, deleted and foreign ones not"
  issue: "130"
  given:
    - sql: |
        INSERT INTO households (id, household_display_name) VALUES ('0192f0a0-0000-7000-8000-000000000002', 'Other Household');
        INSERT INTO categories (id, household_id, category_display_name, bucket, active, deleted_at, created_at) VALUES
          ('0192f0a0-0000-7000-8003-000000000001', '0192f0a0-0000-7000-8000-000000000001', 'Rent',     'commitment', true,  NULL,  '2026-01-01T00:00:00Z'),
          ('0192f0a0-0000-7000-8003-000000000002', '0192f0a0-0000-7000-8000-000000000001', 'Gym',      'commitment', false, NULL,  '2026-01-02T00:00:00Z'),
          ('0192f0a0-0000-7000-8003-000000000003', '0192f0a0-0000-7000-8000-000000000001', 'Gone',     'daily',      true,  now(), '2026-01-03T00:00:00Z'),
          ('0192f0a0-0000-7000-8003-000000000009', '0192f0a0-0000-7000-8000-000000000002', 'Theirs',   'daily',      true,  NULL,  '2026-01-04T00:00:00Z')
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request:
    method: GET
    path: /categories
  expect:
    status: 200
    body_json: {"items": [{"id": "0192f0a0-0000-7000-8003-000000000001", "category_display_name": "Rent", "bucket": "commitment", "active": true}, {"id": "0192f0a0-0000-7000-8003-000000000002", "category_display_name": "Gym", "bucket": "commitment", "active": false}]}
    cookies: {}
    rows:
      - sql: SELECT id::text AS id, household_id::text AS household_id, category_display_name AS name, bucket, active, (deleted_at IS NOT NULL) AS deleted FROM categories ORDER BY id
        rows:
          - {id: "0192f0a0-0000-7000-8003-000000000001", household_id: "0192f0a0-0000-7000-8000-000000000001", name: "Rent", bucket: "commitment", active: true, deleted: false}
          - {id: "0192f0a0-0000-7000-8003-000000000002", household_id: "0192f0a0-0000-7000-8000-000000000001", name: "Gym", bucket: "commitment", active: false, deleted: false}
          - {id: "0192f0a0-0000-7000-8003-000000000003", household_id: "0192f0a0-0000-7000-8000-000000000001", name: "Gone", bucket: "daily", active: true, deleted: true}
          - {id: "0192f0a0-0000-7000-8003-000000000009", household_id: "0192f0a0-0000-7000-8000-000000000002", name: "Theirs", bucket: "daily", active: true, deleted: false}


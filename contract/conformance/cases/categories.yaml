- name: "categories - listing with an expired session is unauthorized, clears the cookie and writes nothing"
  issue: "130"
  given:
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
    - sql: |
        UPDATE sessions SET expires_at = now() - interval '1 minute'
  request:
    method: GET
    path: /categories
  expect:
    status: 401
    body_json: {"code": "UNAUTHORIZED"}
    cookies:
      afloat_session:
        value: ""
        path: /
        max_age: 0
        http_only: true
        secure: false
        same_site: Lax
        expires: past
    rows:
      - sql: SELECT (SELECT count(*) FROM categories)::int AS categories, (SELECT count(*) FROM budgets)::int AS budgets, (SELECT count(*) FROM allocations)::int AS allocations
        rows:
          - {categories: 0, budgets: 0, allocations: 0}


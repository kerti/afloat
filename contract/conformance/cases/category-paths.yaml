# The path-parameter table of #106 item 1, run against PATCH, DELETE and
# POST .../restore of /categories/{id}, as pocket-paths.yaml and
# pocket-paths-delete.yaml do against the Pocket's: how every shape of a path parameter
# is answered, through the real router and the generated binder. A parameter is
# percent-decoded exactly once (#65); for a uuid the binder refuses everything that
# is not one, with 400 VALIDATION {field: id, rule: invalid}, after the session
# check. A trailing slash and an empty parameter match no route: the bare 404 an
# unregistered path gives (same_as). HEAD is 405: there is no GET on this path.
# The spellings uuid.Parse accepts name the same Category and are accepted
# (refusing them would take a `pattern` on the path parameter, which the validator
# would check on the ENCODED form and so refuse the encoded spelling of a valid
# id). Every row asserts the Category row: a mis-decoded id is a hazard to a write.
# The DELETE rows (#130, PR 4) are the verb a mis-decoded id would hurt most: every
# refusal leaves the Category live, every accepted spelling deletes it. The restore
# rows run the shapes that differ there; as for a Pocket's restore, an empty
# parameter (/categories//restore) is not a path that does not exist: {id} matches
# the empty segment and the binder refuses it, 400 invalid.
#
# The Category every case starts with: 0192f0a0-0000-7000-8003-000000000001, Rent,
# a Commitment of Household 1, active, allocated 3.000.000.


- name: "category paths - %2541 binds %41, which is not a uuid, a malformed id"
  issue: "106"
  given: &seeded-one
    - sql: |
        INSERT INTO categories (id, household_id, category_display_name, bucket) VALUES ('0192f0a0-0000-7000-8003-000000000001', '0192f0a0-0000-7000-8000-000000000001', 'Rent', 'commitment');
        INSERT INTO budgets (household_id, year_month) VALUES ('0192f0a0-0000-7000-8000-000000000001', to_char((now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours', 'YYYY-MM'));
        INSERT INTO allocations (household_id, year_month, effective_on, category_id, allocation) VALUES ('0192f0a0-0000-7000-8000-000000000001', to_char((now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours', 'YYYY-MM'), ((now() AT TIME ZONE 'Asia/Jakarta') - interval '4 hours')::date, '0192f0a0-0000-7000-8003-000000000001', 3000000)
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request:
    method: PATCH
    path: /categories/%2541
    headers:
      Content-Type: application/json
    body: '{"active":false}'
  expect:
    status: 400
    body_json: {"code": "VALIDATION", "args": {"field": "id", "rule": "invalid"}}
    cookies: {}
    rows:
      - sql: SELECT category_display_name AS name, active FROM categories
        rows: [{"name": "Rent", "active": true}]



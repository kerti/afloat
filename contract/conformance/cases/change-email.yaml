# Tenancy: bob (same Household) and dave (another) are untouched.
- name: change email - leaves every other User alone
  issue: "119"
  given:
    - sql: INSERT INTO households (id, household_display_name) VALUES ('0192f0a0-0000-7000-8000-000000000002', 'Another Household')
    - sql: INSERT INTO users (id, household_id, email, user_display_name) VALUES ('0192f0a0-0000-7000-8000-0000000000d1', '0192f0a0-0000-7000-8000-000000000002', 'dave@example.com', 'Dave')
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request: *change
  expect:
    status: 200
    rows:
      - sql: SELECT email, user_display_name FROM users WHERE id <> '0192f0a0-0000-7000-8000-0000000000a1' ORDER BY email
        rows:
          - {email: bob@example.com, user_display_name: Bob}
          - {email: carol@example.com, user_display_name: Carol}
          - {email: dave@example.com, user_display_name: Dave}

# The contract's shape rules, judged first.
- name: change email - not an address is a validation failure
  issue: "119"
  given: *signed-in
  request:
    method: POST
    path: /auth/local/change-email
    headers:
      Content-Type: application/json
    body: '{"email":"nobody","current_password":"conformance-correct-horse"}'
  expect:
    status: 400
    body_json: {code: VALIDATION, args: {field: email, rule: email}}
    rows: &nothing-recorded
      - sql: SELECT email FROM users WHERE id = '0192f0a0-0000-7000-8000-0000000000a1'
        rows: [{email: alice@example.com}]
      - sql: SELECT count(*)::int AS n FROM login_attempts
        rows: [{n: 0}]


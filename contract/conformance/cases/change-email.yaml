# The address's state is revealed only to a caller who has proved the password.
- name: change email - a wrong password with a taken address is 403, not 409
  issue: "119"
  given: *signed-in
  request:
    method: POST
    path: /auth/local/change-email
    headers:
      Content-Type: application/json
    body: '{"email":"bob@example.com","current_password":"not the current password"}'
  expect:
    status: 403
    body_json: {code: INVALID_CURRENT_PASSWORD}
    cookies: {}
    rows: &one-failure
      - sql: SELECT email FROM users WHERE id = '0192f0a0-0000-7000-8000-0000000000a1'
        rows: [{email: alice@example.com}]
      - sql: SELECT key, failure_count FROM login_attempts
        rows: [{key: "current-password:0192f0a0-0000-7000-8000-0000000000a1", failure_count: 1}]

- name: change email - inside the backoff window is 429 with Retry-After
  issue: "119"
  given:
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
    - request:
        method: POST
        path: /auth/local/change-email
        headers:
          Content-Type: application/json
        body: '{"email":"alice.new@example.com","current_password":"not the current password"}'
      status: 403
  request: *change
  expect:
    status: 429
    headers:
      Retry-After: "1"
    body_json: {code: TOO_MANY_ATTEMPTS}
    cookies: {}
    rows: *one-failure

# One key for both operations, from the other side.
- name: change email - a failure through change-password throttles it
  issue: "119"
  given:
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
    - request:
        method: POST
        path: /auth/local/change-password
        headers:
          Content-Type: application/json
        body: '{"current_password":"not the current password","new_password":"kucing oranye di atap"}'
      status: 403
  request: *change
  expect:
    status: 429
    headers:
      Retry-After: "1"
    body_json: {code: TOO_MANY_ATTEMPTS}
    rows: *one-failure

# A success clears the key, and so does a proved password whose address turns
# out to be taken.
- name: change email - a success clears the backoff key
  issue: "119"
  given:
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
    - request:
        method: POST
        path: /auth/local/change-email
        headers:
          Content-Type: application/json
        body: '{"email":"alice.new@example.com","current_password":"not the current password"}'
      status: 403
    - sql: UPDATE login_attempts SET backoff_until = now() - interval '1 second'
  request: *change
  expect:
    status: 200
    rows:
      - sql: SELECT count(*)::int AS n FROM login_attempts
        rows: [{n: 0}]


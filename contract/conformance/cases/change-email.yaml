# POST /auth/local/change-email (#119): the sign-in address, behind the current
# password. The change takes effect at once and is not verified (there is no
# mail transport, PRD §4). No session is touched: a session is keyed on the
# User's id, and what stops a stolen cookie swapping the handle is the
# current-password gate.
#
# The order is the point (BOOTSTRAP.md §5.1.1): the session, the body's shape,
# then the same throttle and password check as change-password, under the same
# key, and only then the address. A caller who has not proved the password
# learns nothing about whether an address is held.
#
# alice is the caller, bob is a live User in her Household, carol is
# soft-deleted (so her address is free: the unique index is partial).

- name: change email - success answers the whole Me and touches no session
  issue: "119"
  given: &signed-in
    - sql: INSERT INTO sessions (id, user_id, expires_at) VALUES (encode(sha256('conformance-other-device'::bytea), 'hex'), '0192f0a0-0000-7000-8000-0000000000a1', now() + interval '30 days')
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request: &change
    method: POST
    path: /auth/local/change-email
    headers:
      Content-Type: application/json
    body: '{"email":"alice.new@example.com","current_password":"conformance-correct-horse"}'
  expect:
    status: 200
    headers:
      Content-Type: application/json
    body_json:
      id: 0192f0a0-0000-7000-8000-0000000000a1
      email: alice.new@example.com
      user_display_name: Alice
      locale: en-GB
      time_zone: Asia/Jakarta
      appearance: system
      today: "<re:[0-9]{4}-[0-9]{2}-[0-9]{2}>"
      household:
        id: 0192f0a0-0000-7000-8000-000000000001
        household_display_name: Conformance Household
        reporting_currency: IDR
        period_start_day: 1
        day_starts_at: "04:00"
        allowance_mode: adaptive
    # No cookie: no session is minted or touched.
    cookies: {}
    rows:
      - sql: SELECT email FROM users WHERE id = '0192f0a0-0000-7000-8000-0000000000a1'
        rows: [{email: alice.new@example.com}]
      # Both of alice's sessions, the other device's included.
      - sql: SELECT count(*)::int AS n FROM sessions WHERE user_id = '0192f0a0-0000-7000-8000-0000000000a1'
        rows: [{n: 2}]
      - sql: SELECT (password_hash = '$argon2id$v=19$m=19456,t=2,p=1$ONoBwoeQyx5Q6rcT+99mQQ$SwIz0ZviKsLDspuhSO7B6UvPvKMokTfAVA9i9RqMiUg') AS seeded FROM credentials WHERE user_id = '0192f0a0-0000-7000-8000-0000000000a1'
        rows: [{seeded: true}]
      - sql: SELECT count(*)::int AS n FROM login_attempts
        rows: [{n: 0}]


# The session cannot be read during an outage: the middleware's 500, not the 401
# of an invalid session, with the cookie left alone (#27).
- name: change email - during an outage is 500 and changes nothing
  issue: "119"
  given:
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
    - outage: true
  request: *change
  expect:
    status: 500
    body_json: {code: INTERNAL}
    cookies: {}
    rows:
      - sql: SELECT email FROM users WHERE id = '0192f0a0-0000-7000-8000-0000000000a1'
        rows: [{email: alice@example.com}]
      - sql: SELECT count(*)::int AS n FROM sessions
        rows: [{n: 1}]

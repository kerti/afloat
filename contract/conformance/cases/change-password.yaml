# One key for both operations, so the two routes cannot double the guesses.
- name: change password - a failure through change-email throttles it
  issue: "119"
  given:
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
    - request:
        method: POST
        path: /auth/local/change-email
        headers:
          Content-Type: application/json
        body: '{"email":"new@example.com","current_password":"not the current password"}'
      status: 403
  request: *change
  expect:
    status: 429
    headers:
      Retry-After: "1"
    body_json: {code: TOO_MANY_ATTEMPTS}
    rows: *one-failure-unchanged

# A User with no credential has no current password to give: bob cannot sign
# in, so a session is opened for him directly. Answered as a wrong password.
- name: change password - a User with no credential is answered as a wrong password
  issue: "119"
  given:
    - sql: INSERT INTO sessions (id, user_id, expires_at) VALUES (encode(sha256('conformance-bob'::bytea), 'hex'), '0192f0a0-0000-7000-8000-0000000000b1', now() + interval '30 days')
  request:
    method: POST
    path: /auth/local/change-password
    headers:
      Content-Type: application/json
      Cookie: afloat_session=conformance-bob
    body: '{"current_password":"conformance-correct-horse","new_password":"kucing oranye di atap"}'
  expect:
    status: 403
    body_json: {code: INVALID_CURRENT_PASSWORD}
    cookies: {}
    rows:
      - sql: SELECT key, failure_count FROM login_attempts
        rows: [{key: "current-password:0192f0a0-0000-7000-8000-0000000000b1", failure_count: 1}]
      - sql: SELECT count(*)::int AS n FROM credentials WHERE user_id = '0192f0a0-0000-7000-8000-0000000000b1'
        rows: [{n: 0}]


# The cookie the client is left holding is the new session's, and it works. This
# session is past half its window, so the session middleware has queued a
# refreshed cookie for the OLD token; the 204's Set-Cookie must replace it, or
# the jar keeps a revoked token and the next request is a 401.
- name: change password - a session past half its window still ends up with the new cookie
  issue: "119"
  given:
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
    - sql: UPDATE sessions SET expires_at = now() + interval '1 hour'
    - request: *change
      status: 204
  request:
    method: GET
    path: /me
  expect:
    status: 200
    body_json:
      id: 0192f0a0-0000-7000-8000-0000000000a1
      email: alice@example.com
      user_display_name: Alice
      locale: en-GB
      time_zone: Asia/Jakarta
      appearance: system
      today: "<re:[0-9]{4}-[0-9]{2}-[0-9]{2}>"
      household:
        id: 0192f0a0-0000-7000-8000-000000000001
        household_display_name: Conformance Household
        reporting_currency: IDR
        period_start_day: 1
        day_starts_at: "04:00"
        allowance_mode: adaptive
    cookies: {}

- name: change password - a session past half its window is answered with exactly one cookie
  issue: "119"
  given:
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
    - sql: UPDATE sessions SET expires_at = now() + interval '1 hour'
  request: *change
  expect:
    status: 204
    body_empty: true
    cookies:
      afloat_session:
        value_pattern: '[A-Za-z0-9_-]{43}'
        path: /
        max_age: 2592000
        http_only: true
        secure: false
        same_site: Lax
        expires: max-age
    rows:
      - sql: SELECT count(*)::int AS n FROM sessions
        rows: [{n: 1}]

# Every session, not only the caller's: another device's goes too.
- name: change password - another device's session is revoked
  issue: "119"
  given:
    - sql: INSERT INTO sessions (id, user_id, expires_at) VALUES (encode(sha256('conformance-other-device'::bytea), 'hex'), '0192f0a0-0000-7000-8000-0000000000a1', now() + interval '30 days')
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request: *change
  expect:
    status: 204
    rows:
      - sql: SELECT count(*)::int AS n FROM sessions
        rows: [{n: 1}]
      - sql: SELECT count(*)::int AS n FROM sessions WHERE id = encode(sha256('conformance-other-device'::bytea), 'hex')
        rows: [{n: 0}]

# Tenancy. bob is in alice's Household, dave is in another, and dave holds the
# same stored hash as alice, so a compare-and-swap that lost its user_id would
# rewrite his credential too. Neither credential nor any session of theirs, or
# carol's, changes.
- name: change password - leaves every other User's credential and sessions alone
  issue: "119"
  given:
    - sql: INSERT INTO households (id, household_display_name) VALUES ('0192f0a0-0000-7000-8000-000000000002', 'Another Household')
    - sql: INSERT INTO users (id, household_id, email, user_display_name) VALUES ('0192f0a0-0000-7000-8000-0000000000d1', '0192f0a0-0000-7000-8000-000000000002', 'dave@example.com', 'Dave')
    - sql: INSERT INTO credentials (user_id, password_hash) SELECT '0192f0a0-0000-7000-8000-0000000000d1', password_hash FROM credentials WHERE user_id = '0192f0a0-0000-7000-8000-0000000000a1'
    - sql: INSERT INTO sessions (id, user_id, expires_at) VALUES (encode(sha256('conformance-dave'::bytea), 'hex'), '0192f0a0-0000-7000-8000-0000000000d1', now() + interval '30 days')
    - sql: INSERT INTO sessions (id, user_id, expires_at) VALUES (encode(sha256('conformance-bob'::bytea), 'hex'), '0192f0a0-0000-7000-8000-0000000000b1', now() + interval '30 days')
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request: *change
  expect:
    status: 204
    rows:
      - sql: SELECT user_id::text AS user_id, (password_hash = '$argon2id$v=19$m=19456,t=2,p=1$ONoBwoeQyx5Q6rcT+99mQQ$SwIz0ZviKsLDspuhSO7B6UvPvKMokTfAVA9i9RqMiUg') AS seeded FROM credentials ORDER BY user_id
        rows:
          - {user_id: 0192f0a0-0000-7000-8000-0000000000a1, seeded: false}
          - {user_id: 0192f0a0-0000-7000-8000-0000000000c1, seeded: true}
          - {user_id: 0192f0a0-0000-7000-8000-0000000000d1, seeded: true}
      - sql: SELECT user_id::text AS user_id, count(*)::int AS n FROM sessions GROUP BY user_id ORDER BY user_id
        rows:
          - {user_id: 0192f0a0-0000-7000-8000-0000000000a1, n: 1}
          - {user_id: 0192f0a0-0000-7000-8000-0000000000b1, n: 1}
          - {user_id: 0192f0a0-0000-7000-8000-0000000000d1, n: 1}

- name: change password - a wrong current password is 403 and counts one failure
  issue: "119"
  given: *signed-in
  request:
    method: POST
    path: /auth/local/change-password
    headers:
      Content-Type: application/json
    body: '{"current_password":"not the current password","new_password":"kucing oranye di atap"}'
  expect:
    status: 403
    body_json: {code: INVALID_CURRENT_PASSWORD}
    cookies: {}
    rows: &one-failure-unchanged
      - sql: SELECT key, failure_count FROM login_attempts
        rows: [{key: "current-password:0192f0a0-0000-7000-8000-0000000000a1", failure_count: 1}]
      - sql: SELECT (password_hash = '$argon2id$v=19$m=19456,t=2,p=1$ONoBwoeQyx5Q6rcT+99mQQ$SwIz0ZviKsLDspuhSO7B6UvPvKMokTfAVA9i9RqMiUg') AS seeded FROM credentials WHERE user_id = '0192f0a0-0000-7000-8000-0000000000a1'
        rows: [{seeded: true}]
      - sql: SELECT count(*)::int AS n FROM sessions
        rows: [{n: 1}]

# Inside the window even the right password is refused: backoff, never a lockout.
- name: change password - inside the backoff window is 429 with Retry-After
  issue: "119"
  given:
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
    - request:
        method: POST
        path: /auth/local/change-password
        headers:
          Content-Type: application/json
        body: '{"current_password":"not the current password","new_password":"kucing oranye di atap"}'
      status: 403
  request: *change
  expect:
    status: 429
    headers:
      Retry-After: "1"
    body_json: {code: TOO_MANY_ATTEMPTS}
    cookies: {}
    rows: *one-failure-unchanged

- name: change password - a success clears the backoff key
  issue: "119"
  given:
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
    - request:
        method: POST
        path: /auth/local/change-password
        headers:
          Content-Type: application/json
        body: '{"current_password":"not the current password","new_password":"kucing oranye di atap"}'
      status: 403
    - sql: UPDATE login_attempts SET backoff_until = now() - interval '1 second'
  request: *change
  expect:
    status: 204
    rows:
      - sql: SELECT count(*)::int AS n FROM login_attempts
        rows: [{n: 0}]

# The policy is judged before the throttle and before any hashing, so a weak
# password costs nothing and records nothing.
- name: change password - a short new password is WEAK_PASSWORD min
  issue: "119"
  given: *signed-in
  request:
    method: POST
    path: /auth/local/change-password
    headers:
      Content-Type: application/json
    body: '{"current_password":"conformance-correct-horse","new_password":"short"}'
  expect:
    status: 400
    body_json: {code: WEAK_PASSWORD, args: {reason: min}}
    cookies: {}
    rows: &nothing-changed
      - sql: SELECT count(*)::int AS n FROM login_attempts
        rows: [{n: 0}]
      - sql: SELECT (password_hash = '$argon2id$v=19$m=19456,t=2,p=1$ONoBwoeQyx5Q6rcT+99mQQ$SwIz0ZviKsLDspuhSO7B6UvPvKMokTfAVA9i9RqMiUg') AS seeded FROM credentials WHERE user_id = '0192f0a0-0000-7000-8000-0000000000a1'
        rows: [{seeded: true}]
      - sql: SELECT count(*)::int AS n FROM sessions
        rows: [{n: 1}]


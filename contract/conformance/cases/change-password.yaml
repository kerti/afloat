# POST /auth/local/change-password (#119): a new password behind the current
# one. On success every session the User holds is revoked, the caller's
# included, and a fresh one is minted for the caller in the same transaction;
# the 204 carries its cookie (BOOTSTRAP.md §5.1).
#
# The failure order is the point (BOOTSTRAP.md §5.1.1): the session, then the
# body's shape, then the new password against the policy (before any hashing and
# before the throttle), then the throttle, then the current password. A wrong
# current password is 403 INVALID_CURRENT_PASSWORD and arms a backoff keyed on
# the User, `current-password:<user id>`, which change-email shares.
# LOGIN_FIRST_BACKOFF is 1s in this suite, so a window opened by a given step is
# still open when the request is sent.
#
# alice (the caller) holds the seeded credential. carol is soft-deleted and
# holds the very same hash, so a statement that lost its user_id filter would
# show on her row; bob has no credential.

- name: change password - success revokes the old session and mints a new one
  issue: "119"
  given: &signed-in
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request: &change
    method: POST
    path: /auth/local/change-password
    headers:
      Content-Type: application/json
    body: '{"current_password":"conformance-correct-horse","new_password":"kucing oranye di atap"}'
  expect:
    status: 204
    body_empty: true
    cookies:
      afloat_session:
        value_pattern: '[A-Za-z0-9_-]{43}'
        path: /
        max_age: 2592000
        http_only: true
        secure: false
        same_site: Lax
        expires: max-age
    rows:
      # One session, the new one: the login's was revoked.
      - sql: SELECT count(*)::int AS n FROM sessions WHERE user_id = '0192f0a0-0000-7000-8000-0000000000a1'
        rows: [{n: 1}]
      - sql: SELECT (password_hash <> '$argon2id$v=19$m=19456,t=2,p=1$ONoBwoeQyx5Q6rcT+99mQQ$SwIz0ZviKsLDspuhSO7B6UvPvKMokTfAVA9i9RqMiUg') AS changed, (password_hash LIKE '$argon2id$v=19$m=19456,t=2,p=1$%') AS argon2id FROM credentials WHERE user_id = '0192f0a0-0000-7000-8000-0000000000a1'
        rows: [{changed: true, argon2id: true}]
      - sql: SELECT count(*)::int AS n FROM login_attempts
        rows: [{n: 0}]

- name: change password - the new password signs in
  issue: "119"
  given:
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
    - request: *change
      status: 204
  request:
    method: POST
    path: /auth/local/login
    headers:
      Content-Type: application/json
    body: '{"email":"alice@example.com","password":"kucing oranye di atap"}'
  expect:
    status: 204
    body_empty: true

- name: change password - the old password no longer signs in
  issue: "119"
  given:
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'

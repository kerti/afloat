# PATCH /pockets/{id} (#121): a cross-site page must not be able to rename or
# deactivate a Pocket of the signed-in Household. The guard runs before the
# session and the binder, so even an id that would not bind is refused first.
- name: csrf - cross-site pocket update is blocked and the Pocket is unchanged
  issue: "121"
  given:
    - sql: INSERT INTO pockets (id, household_id, pocket_display_name) VALUES ('0192f0a0-0000-7000-8001-000000000001', '0192f0a0-0000-7000-8000-000000000001', 'OVO')
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request:
    method: PATCH
    path: /pockets/0192f0a0-0000-7000-8001-000000000001
    headers:
      Content-Type: application/json
      Sec-Fetch-Site: cross-site
    body: '{"pocket_display_name":"Hijacked","active":false}'
  expect:
    status: 403
    body_json: {code: CROSS_SITE_REQUEST_BLOCKED}
    cookies: {}
    rows:
      - sql: SELECT pocket_display_name AS name, active FROM pockets
        rows: [{name: OVO, active: true}]

- name: csrf - a foreign Origin on a pocket update with a malformed id is blocked before the binder
  issue: "121"
  given:
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request:
    method: PATCH
    path: /pockets/not-a-uuid
    headers:
      Content-Type: application/json
      Origin: http://evil.example
    body: '{"active":false}'
  expect:
    status: 403
    body_json: {code: CROSS_SITE_REQUEST_BLOCKED}
    cookies: {}

# The repo's first DELETE (#121, PR 3): the guard covers every non-safe method,
# so a cross-site page must not be able to delete a Pocket of the signed-in
# Household, and the row is as it was (not deleted, updated_at not moved). It
# answers before the session and the binder, so an id that would not bind is
# refused first, and so is a request with no session.
- name: csrf - cross-site pocket delete is blocked and the Pocket is not deleted
  issue: "121"
  given:
    - sql: INSERT INTO pockets (id, household_id, pocket_display_name, created_at, updated_at) VALUES ('0192f0a0-0000-7000-8001-000000000001', '0192f0a0-0000-7000-8000-000000000001', 'OVO', '2026-01-01T00:00:00Z', '2026-01-01T00:00:00Z')
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request:
    method: DELETE
    path: /pockets/0192f0a0-0000-7000-8001-000000000001
    headers:
      Sec-Fetch-Site: cross-site
  expect:
    status: 403
    body_json: {code: CROSS_SITE_REQUEST_BLOCKED}
    cookies: {}
    rows:
      - sql: SELECT pocket_display_name AS name, active, (deleted_at IS NOT NULL) AS deleted, (updated_at = '2026-01-01T00:00:00Z') AS untouched FROM pockets
        rows: [{name: OVO, active: true, deleted: false, untouched: true}]



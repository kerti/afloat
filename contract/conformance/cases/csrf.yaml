# The cross-site guard (BOOTSTRAP.md §5, "a second CSRF layer behind
# SameSite=Lax"): a non-safe method is refused when Sec-Fetch-Site says the
# request came from elsewhere, or - with no Sec-Fetch-Site - when Origin names
# another host. Safe methods pass untouched. The guard answers before any
# handler runs, so a refused login burns no backoff.
#
# Host is set explicitly where Origin is compared, so the case means the same
# thing whichever port the server listens on.

- name: csrf - cross-site login is blocked
  request:
    method: POST
    path: /auth/local/login
    headers:
      Content-Type: application/json
      Sec-Fetch-Site: cross-site
    body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
  expect:
    status: 403
    body_json: {code: CROSS_SITE_REQUEST_BLOCKED}
    cookies: {}
    rows:
      - sql: SELECT (SELECT count(*) FROM sessions)::int AS sessions, (SELECT count(*) FROM login_attempts)::int AS attempts
        rows: [{sessions: 0, attempts: 0}]

- name: csrf - same-site is not same-origin, and is blocked
  request:
    method: POST
    path: /auth/local/login
    headers:
      Content-Type: application/json
      Sec-Fetch-Site: same-site
    body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
  expect:
    status: 403
    body_json: {code: CROSS_SITE_REQUEST_BLOCKED}
    cookies: {}
    rows:
      - sql: SELECT (SELECT count(*) FROM sessions)::int AS sessions, (SELECT count(*) FROM login_attempts)::int AS attempts
        rows: [{sessions: 0, attempts: 0}]

- name: csrf - same-origin login passes
  request:
    method: POST
    path: /auth/local/login
    headers:
      Content-Type: application/json
      Sec-Fetch-Site: same-origin
    body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
  expect:
    status: 204
    body_empty: true
    cookies:
      afloat_session: &session-cookie
        value_pattern: '[A-Za-z0-9_-]{43}'
        path: /
        max_age: 2592000
        http_only: true
        secure: false
        same_site: Lax
        expires: max-age
    rows:
      - sql: SELECT (SELECT count(*) FROM sessions)::int AS sessions, (SELECT count(*) FROM login_attempts)::int AS attempts
        rows: [{sessions: 1, attempts: 0}]

# A user typing the URL, or a bookmark.
- name: csrf - Sec-Fetch-Site none passes
  request:
    method: POST
    path: /auth/local/login
    headers:
      Content-Type: application/json
      Sec-Fetch-Site: none
    body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
  expect:
    status: 204
    body_empty: true
    cookies:
      afloat_session: *session-cookie
    rows:
      - sql: SELECT (SELECT count(*) FROM sessions)::int AS sessions, (SELECT count(*) FROM login_attempts)::int AS attempts
        rows: [{sessions: 1, attempts: 0}]

# Sec-Fetch-Site wins where both are sent: a browser that sends it knows.
- name: csrf - Sec-Fetch-Site same-origin wins over a foreign Origin
  request:
    method: POST
    path: /auth/local/login
    headers:
      Content-Type: application/json
      Sec-Fetch-Site: same-origin
      Origin: http://evil.example
    body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
  expect:
    status: 204
    body_empty: true
    cookies:
      afloat_session: *session-cookie
    rows:
      - sql: SELECT (SELECT count(*) FROM sessions)::int AS sessions, (SELECT count(*) FROM login_attempts)::int AS attempts
        rows: [{sessions: 1, attempts: 0}]

- name: csrf - a foreign Origin with no Sec-Fetch-Site is blocked
  request:
    method: POST
    path: /auth/local/login
    headers:
      Content-Type: application/json
      Host: afloat.test
      Origin: http://evil.example
    body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
  expect:
    status: 403
    body_json: {code: CROSS_SITE_REQUEST_BLOCKED}
    cookies: {}
    rows:
      - sql: SELECT (SELECT count(*) FROM sessions)::int AS sessions, (SELECT count(*) FROM login_attempts)::int AS attempts
        rows: [{sessions: 0, attempts: 0}]

- name: csrf - a matching Origin with no Sec-Fetch-Site passes
  request:
    method: POST
    path: /auth/local/login
    headers:
      Content-Type: application/json
      Host: afloat.test
      Origin: http://afloat.test
    body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
  expect:
    status: 204
    body_empty: true
    cookies:
      afloat_session: *session-cookie
    rows:
      - sql: SELECT (SELECT count(*) FROM sessions)::int AS sessions, (SELECT count(*) FROM login_attempts)::int AS attempts
        rows: [{sessions: 1, attempts: 0}]

# Logout is a POST too: a cross-site page must not be able to sign a user out.
- name: csrf - cross-site logout is blocked and the session survives
  given:
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request:
    method: POST
    path: /auth/logout
    headers:
      Sec-Fetch-Site: cross-site
  expect:
    status: 403
    body_json: {code: CROSS_SITE_REQUEST_BLOCKED}
    cookies: {}
    rows:
      - sql: SELECT count(*)::int AS n FROM sessions
        rows: [{n: 1}]

# Every case above is a POST. The guard covers every non-safe method, so PATCH
# too (#113): a cross-site page must not be able to change the Household.
- name: csrf - cross-site household patch is blocked and the Household is unchanged
  issue: "113"
  given:
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request:
    method: PATCH
    path: /household
    headers:
      Content-Type: application/json
      Sec-Fetch-Site: cross-site
    body: '{"household_display_name":"Hijacked"}'
  expect:
    status: 403
    body_json: {code: CROSS_SITE_REQUEST_BLOCKED}
    cookies: {}
    rows:
      - sql: SELECT household_display_name FROM households
        rows: [{household_display_name: Conformance Household}]

- name: csrf - a foreign Origin on a household patch is blocked
  issue: "113"
  given:
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request:
    method: PATCH
    path: /household
    headers:
      Content-Type: application/json
      Origin: http://evil.example
    body: '{"household_display_name":"Hijacked"}'
  expect:
    status: 403
    body_json: {code: CROSS_SITE_REQUEST_BLOCKED}
    cookies: {}
    rows:
      - sql: SELECT household_display_name FROM households
        rows: [{household_display_name: Conformance Household}]

- name: csrf - a safe method is never blocked
  request:
    method: GET
    path: /auth/methods
    headers:
      Sec-Fetch-Site: cross-site
      Origin: http://evil.example
  expect:
    status: 200
    body_json: {local: true, google: false, founding_open: true}

# The same guard covers the credential-gated routes and PATCH /me (#119): a
# cross-site page must not change a password, an address or a setting, and the
# credential, the session and the row are as they were.
- name: csrf - cross-site change-password is blocked and the credential is unchanged
  issue: "119"
  given:
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request:
    method: POST
    path: /auth/local/change-password
    headers:
      Content-Type: application/json
      Sec-Fetch-Site: cross-site
    body: '{"current_password":"conformance-correct-horse","new_password":"kucing oranye di atap"}'
  expect:
    status: 403
    body_json: {code: CROSS_SITE_REQUEST_BLOCKED}
    cookies: {}
    rows:
      - sql: SELECT (password_hash = '$argon2id$v=19$m=19456,t=2,p=1$ONoBwoeQyx5Q6rcT+99mQQ$SwIz0ZviKsLDspuhSO7B6UvPvKMokTfAVA9i9RqMiUg') AS seeded FROM credentials WHERE user_id = '0192f0a0-0000-7000-8000-0000000000a1'
        rows: [{seeded: true}]
      - sql: SELECT (SELECT count(*) FROM sessions)::int AS sessions, (SELECT count(*) FROM login_attempts)::int AS attempts
        rows: [{sessions: 1, attempts: 0}]

- name: csrf - a foreign Origin on change-password is blocked
  issue: "119"
  given:
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request:
    method: POST
    path: /auth/local/change-password
    headers:
      Content-Type: application/json
      Origin: http://evil.example
    body: '{"current_password":"conformance-correct-horse","new_password":"kucing oranye di atap"}'
  expect:
    status: 403
    body_json: {code: CROSS_SITE_REQUEST_BLOCKED}
    cookies: {}
    rows:
      - sql: SELECT (password_hash = '$argon2id$v=19$m=19456,t=2,p=1$ONoBwoeQyx5Q6rcT+99mQQ$SwIz0ZviKsLDspuhSO7B6UvPvKMokTfAVA9i9RqMiUg') AS seeded FROM credentials WHERE user_id = '0192f0a0-0000-7000-8000-0000000000a1'
        rows: [{seeded: true}]

- name: csrf - cross-site change-email is blocked and the address is unchanged
  issue: "119"
  given:
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request:
    method: POST
    path: /auth/local/change-email
    headers:
      Content-Type: application/json
      Sec-Fetch-Site: cross-site
    body: '{"email":"mallory@example.com","current_password":"conformance-correct-horse"}'
  expect:
    status: 403
    body_json: {code: CROSS_SITE_REQUEST_BLOCKED}
    cookies: {}
    rows:
      - sql: SELECT email FROM users WHERE id = '0192f0a0-0000-7000-8000-0000000000a1'
        rows: [{email: alice@example.com}]

- name: csrf - cross-site user settings patch is blocked and the User is unchanged
  issue: "119"
  given:
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request:
    method: PATCH
    path: /me
    headers:
      Content-Type: application/json
      Sec-Fetch-Site: cross-site
    body: '{"user_display_name":"Hijacked"}'
  expect:
    status: 403
    body_json: {code: CROSS_SITE_REQUEST_BLOCKED}

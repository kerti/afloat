# GET /expenses?deleted=true (#140 PR 5, R11): the Recycle Bin. The same wrapper and
# paging as the live list, but only the Household's deleted Expenses, ordered
# deleted_at DESC then id DESC, each carrying its deleted_at, with NO
# uncategorised_count (it counts live rows and the bin lists none). The bin's cursor
# is its own shape, {d: deleted_at in microseconds, i: id}; a cursor of the live list
# is not one of the bin and the other way round. The bin has no filter, so
# uncategorised=true beside it is refused. The cursors below are computed from the
# seed's fixed deletion instants.
#
# The rows a case starts with (Household 1 is the signed-in one). Every updated_at is
# the same fixed instant and every seeded deletion a fixed one, so `untouched` and
# the `deleted` column ('MM-DD' for the seed's instant, 'now' for this request's)
# say whether a request moved either:
#   (Pockets: OVO active, Keeper active so OVO is never the last active one, Dana INACTIVE; Household 2 has Theirs)
#   0192f0a0-0000-7000-8004-000000000001  H1 live, 25000 on OVO, Food, 19:05, "Lunch"
#   0192f0a0-0000-7000-8004-000000000002  H1 live, a refund of 450000, bare
#   0192f0a0-0000-7000-8004-000000000003  H1 DELETED 01-06, 30000 on OVO, "Taxi"
#   0192f0a0-0000-7000-8004-000000000004  H1 DELETED 01-07, a refund of 12000.5 on Dana (INACTIVE) in Gym (INACTIVE)
#   0192f0a0-0000-7000-8004-000000000005  H1 DELETED 01-08 (the same instant as 006: id DESC breaks the tie)
#   0192f0a0-0000-7000-8004-000000000006  H1 DELETED 01-08
#   0192f0a0-0000-7000-8004-000000000007  H1 live, 7000 on Dana (INACTIVE) in Gym (INACTIVE)
#   0192f0a0-0000-7000-8004-00000000005a  Household 2, live
#   0192f0a0-0000-7000-8004-00000000005b  Household 2, DELETED 01-09
#
# Generated rows are written out in full on purpose: a hand-written case file's
# likeliest defect is an assertion that passes against any answer.


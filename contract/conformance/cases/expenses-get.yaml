# GET /expenses/{id} (#140, PR 4; X1): one Expense, in the shape the list, the create
# and the edit answer, so a route that names an Expense (the edit screen, a reload,
# a link) does not need it to be on a loaded page. Optional properties are omitted
# when empty, never null; a refund keeps its sign at four decimals. An id that is
# unknown, another Household's or deleted is one 404 NOT_FOUND (`same_as` pins the
# relation); a value that is not a UUID is the binder's 400 {id, invalid}, and with
# no session the session answers first. Nothing is written by a read.
#
# The rows a case starts with:
#   0192f0a0-0000-7000-8004-000000000001  Household 1, live, 25000 on OVO, Food, 19:05, "Lunch"
#   0192f0a0-0000-7000-8004-000000000002  Household 1, live, a refund of 450000, bare
#   0192f0a0-0000-7000-8004-000000000003  Household 1, DELETED
#   0192f0a0-0000-7000-8004-00000000005a  Household 2, live
#
# Generated rows are written out in full on purpose: a hand-written case file's
# likeliest defect is an assertion that passes against any answer.


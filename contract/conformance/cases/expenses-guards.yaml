# The three guards (#140 R12, PR 3a): a Pocket or a Category that any Expense
# references, live or in the Recycle Bin, is not deleted (409 POCKET_IN_USE,
# 409 CATEGORY_IN_USE; the answer both offer is to deactivate it, which touches no
# Expense), and the Household's reporting_currency does not change to another
# once it holds any Expense (409 CURRENCY_LOCKED; the stored currency is a no-op).
# Each is a lock on the protected row, an EXISTS in a separate later statement, then
# the write; the races are proven in the backend's suite, which holds one
# transaction at the interleaving (the harness has no concurrent callers).
#
# Order of the Pocket's refusals: NOT_FOUND, the idempotent 204 of one already
# deleted, LAST_POCKET, then POCKET_IN_USE.
#
# Pockets: OVO (...01, active), Dana (...02, inactive), Keeper (...0a, active),
# all Household 1, and Theirs (...09, Household 2). Categories: Food (...01),
# Gym (...02, inactive), Spare (...03). `untouched` says updated_at still holds the
# seeded instant.


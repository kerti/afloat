# GET /expenses (#140, PR 3a): the first paginated list, newest first. Order is
# declared, never the database's: occurred_on DESC, then the effective time DESC
# (occurred_time; else, when captured on that same Period Day, the time of day it
# was captured at in the caller's zone; else the start of the day; every time is an
# offset into its Period Day, so with the seeded 04:00 start 01:30 sorts AFTER
# 23:00), then captured_at DESC, then id DESC. Keyset-paged: `next` is an opaque
# cursor, omitted on the last page; `after` is the cursor of the previous page.
#
# The cursors below are written by hand in the spelling the backend produces (base64url
# of {"o": date, "k": microseconds into the Period Day, "c": microseconds since the
# epoch, "i": id}), which is the one place this file knows more than the contract
# promises ("opaque"): it is how a page boundary can be pinned without a server
# state to read `next` from. `next` itself is only matched by shape.
#
# The seeded User is in Asia/Jakarta (UTC+7), the Household rolls over at 04:00:
#   E1  2026-11-24  no time, captured the same day          newest day
#   E4  2026-11-23  no time, captured 02:00 on the 24th     Period Day the 23rd, offset 22:00
#   E2  2026-11-23  01:30 given                             offset 21:30 (the END of the day)
#   E3  2026-11-23  23:00 given                             offset 19:00
#   E5  2026-11-23  no time, captured 10:00 on the 23rd     offset 06:00
#   E6  2026-11-23  no time, captured on the 25th           back-dated: offset 00:00, captured later
#   E7  2026-11-23  04:00 given                             offset 00:00, captured earlier
#   E8  2026-11-22  23:59 given, a refund                   older day
#   E9  deleted, E90 another Household's: never listed.
# The default Pocket (#140 R3) is derived on GET /pockets and shown here beside the list.


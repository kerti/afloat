# GET /expenses?uncategorised=true and uncategorised_count (#140, PR 4; X8, R8).
# The filter narrows the same live list to the Expenses with no Category: any date,
# the same order (including the effective time) and the same keyset paging, so a
# cursor names a position in the one order and either list resumes from the other's.
# `false` and absent are the whole list; a value that is not a boolean is VALIDATION
# {uncategorised, invalid}. uncategorised_count is on every read of the live list:
# the live uncategorised Expenses of the whole Household, independent of the filter
# and of the page, and never another Household's or a deleted one.
#
# Seeded User in Asia/Jakarta (UTC+7), Household rolls over at 04:00. Newest first,
# the whole list is 1, 4, 2, 3, 5, 6 (as expenses-list.yaml's order case: 4 is a
# bare row captured on its own Period Day at offset 22:00, 2 is 01:30, the END of the
# 23rd, 3 is 23:00 at offset 19:00):
#   ...8004-000000000001  2026-11-24  no time                    uncategorised
#   ...8004-000000000004  2026-11-23  no time, captured 02:00    Food
#   ...8004-000000000002  2026-11-23  01:30                      Food
#   ...8004-000000000003  2026-11-23  23:00                      uncategorised
#   ...8004-000000000005  2026-11-22  no time                    uncategorised
#   ...8004-000000000006  2026-11-20  12:00                      uncategorised
#   ...8004-000000000007  2026-11-24  DELETED, uncategorised
#   ...8004-00000000005a  Household 2, uncategorised
# so the filtered list is 1, 3, 5, 6 and the count is 4 on every read.


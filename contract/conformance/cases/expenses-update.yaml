# PATCH /expenses/{id} (#140, PR 3b; X9 and R9): correct an Expense. Merge semantics
# as every PATCH (BOOTSTRAP.md §4): a property left out is unchanged, `{}` is a
# valid no-op, the answer is the whole Expense. `occurred_time`, `category_id` and
# `description` are the three clearable properties (null clears, absent leaves,
# a value sets); null for any other, and any property that is not editable
# (`id`, `currency`, `captured_at`, `household_id`, `deleted_at`), is
# INVALID_JSON_BODY. A reference (`pocket_id`, `category_id`, `owner_user_id`) is
# judged only when sent AND different from the stored one, so an Expense in a
# since-deactivated Pocket or Category can still be corrected; a changed one is
# judged as at creation (`invalid` for unknown, another Household's and deleted;
# `inactive` for the caller's own inactive row). A write that changes nothing does
# not move updated_at. An id that is unknown, another Household's or deleted is one
# 404 NOT_FOUND, `same_as` pinning the relation, and `{}` is not a way to probe;
# validation comes before the lookup. There is no 409.
#
# The rows a case starts with (`rows:` read every Expense after the request, so a
# case also proves what it did NOT touch; `bumped` says updated_at moved, and
# `captured_same` that captured_at did not):
#   0192f0a0-0000-7000-8004-000000000001  Household 1, live, 25000 on OVO, Food, 19:05, "Lunch"
#   0192f0a0-0000-7000-8004-000000000002  Household 1, live, 10000 on Dana (inactive), Gym (inactive), bare
#   0192f0a0-0000-7000-8004-000000000003  Household 1, DELETED
#   0192f0a0-0000-7000-8004-000000000009  Household 2, live
# The Pockets and Categories are expenses.yaml's, and Fun (...8003-000000000004) is
# a live second Category of Household 1. Bob (...0b1) is Household 1's second User,
# Carol (...0c1) is soft-deleted, Dave (...0d1) is a User of Household 2.
#
# Generated rows are written out in full on purpose: a hand-written case file's
# likeliest defect is an assertion that passes against any answer.


# POST /expenses (#140, PR 3a): the first money row, so the conventions for signed
# money and for a create whose references can change state. The client-supplied
# UUIDv7 is the idempotency key (201 first, 200 for a replay of a live Expense of
# the Household, the STORED row, the rest of the body neither compared nor applied
# and its references not looked at again), an id held by something else is 409
# ID_TAKEN. The amount is a SignedMoneyInput: a leading minus is a refund, zero is
# refused by the handler (VALIDATION {amount, nonzero}), more than four decimals is
# refused and never rounded, a JSON number is INVALID_JSON_BODY. The currency and
# captured_at are the server's and are not properties of the request. An absent
# occurred_on is the writer's Today; a chosen one is stored as sent, the future
# included. A Pocket or Category that is unknown, another Household's or deleted
# is one answer (`invalid`, checked with same_as); the caller's own inactive one is
# `inactive`.
#
# The harness cannot pin a clock, so an absent occurred_on is asserted by a regular
# expression on the answer and by a row query against Postgres's own date; the
# exact dates are the backend's suite's, with an injected clock.
#
# Seed, added to the Household's own (every case's `rows:` read every Expense):
#   0192f0a0-0000-7000-8001-000000000001  OVO     Household 1, live, active
#   0192f0a0-0000-7000-8001-000000000002  Dana    Household 1, live, inactive
#   0192f0a0-0000-7000-8001-000000000003  Gopay   Household 1, deleted
#   0192f0a0-0000-7000-8001-000000000009  Theirs  Household 2, live, active
#   0192f0a0-0000-7000-8003-000000000001  Food    Household 1, live, active
#   0192f0a0-0000-7000-8003-000000000002  Gym     Household 1, live, inactive
#   0192f0a0-0000-7000-8003-000000000003  Typo    Household 1, deleted
#   0192f0a0-0000-7000-8003-000000000009  Theirs  Household 2, live, active
#   0192f0a0-0000-7000-8000-0000000000d1  Dave    a User of Household 2
# Bob (...0b1) is the Household's second User; Carol (...0c1) is soft-deleted.


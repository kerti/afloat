# PATCH /household (#113): the first update in the contract, so the convention
# every later PATCH copies (BOOTSTRAP.md §4): merge semantics, an unknown
# property is INVALID_JSON_BODY, `{}` is a valid no-op, the answer is the whole
# resource, last write wins per field.
#
# The Household is always the caller's own (the session's, never the request's).
# fixtures/seed.sql holds one; cases that prove another is untouched add a
# second in `given:`. `rows:` read the columns, because a response can be right
# while the row behind it is not.
#
# Under an outage the session itself cannot be read, which the session
# middleware answers 500 with the cookie left alone (#27); it never reaches the
# handler, whose own 500s (a failing UPDATE, a soft-deleted Household) the
# backend's suite covers.

- name: household - patch the name
  issue: "113"
  given: &signed-in
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request:
    method: PATCH
    path: /household
    headers:
      Content-Type: application/json
    body: '{"household_display_name":"Rumah Kita"}'
  expect:
    status: 200
    headers:
      Content-Type: application/json
    body_json:
      id: 0192f0a0-0000-7000-8000-000000000001
      household_display_name: Rumah Kita
      reporting_currency: IDR
      period_start_day: 1
      day_starts_at: "04:00"
      allowance_mode: adaptive
    cookies: {}
    rows:
      - sql: |
          SELECT household_display_name, reporting_currency, period_start_day, to_char(day_starts_at, 'HH24:MI') AS day_starts_at,
                 allowance_mode, (expected_monthly_income IS NULL) AS no_income
          FROM households
        rows:
          - {household_display_name: Rumah Kita, reporting_currency: IDR, period_start_day: 1, day_starts_at: "04:00", allowance_mode: adaptive, no_income: true}


# There is no GET, PUT or DELETE on /household, and no hard delete ever
# (BOOTSTRAP.md §4): the router answers 405 as for any route that exists under
# another method, `Allow` naming PATCH and no body. OPTIONS is the flat 405 of
# #66, with no Allow.

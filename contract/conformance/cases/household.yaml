# expected_monthly_income (PRD S7, #130 R17): the first PATCH field that `null`
# clears, so it has to tell an absent property from a null one. A `MoneyInput`
# on the way in (the pattern is the whole rule, no sign, exponent or separator),
# four decimals on the way out, omitted when the Household has none. Nothing is
# computed from it on the server: whether a Monthly Budget exceeds it (S6) is
# the client's to say.

- name: household - set the expected monthly income
  issue: "130"
  given: *signed-in
  request:
    method: PATCH
    path: /household
    headers:
      Content-Type: application/json
    body: '{"expected_monthly_income":"25000000"}'
  expect:
    status: 200
    body_json:
      id: 0192f0a0-0000-7000-8000-000000000001
      household_display_name: Conformance Household
      reporting_currency: IDR
      period_start_day: 1
      day_starts_at: "04:00"
      expected_monthly_income: "25000000.0000"
      allowance_mode: adaptive
    cookies: {}
    rows:
      - sql: SELECT expected_monthly_income::text AS income FROM households
        rows: [{income: "25000000.0000"}]

- name: household - change the expected monthly income, with decimals
  issue: "130"
  given:

- name: household - with an expired session it is unauthorized, clears the cookie and writes nothing
  issue: "113"
  given:
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
    - sql: UPDATE sessions SET expires_at = now() - interval '1 minute'
  request:
    method: PATCH
    path: /household
    headers:
      Content-Type: application/json
    body: '{"household_display_name":"Hijacked"}'
  expect:
    status: 401
    body_json: {code: UNAUTHORIZED}
    cookies:
      afloat_session:
        value: ""
        path: /
        max_age: 0
        http_only: true
        secure: false
        same_site: Lax
        expires: past
    rows: *unchanged

# Tenancy: the Household is the session's, with no id in the request to forge,
# so another Household is untouched by every field. Its row is read back whole.
- name: household - another Household is untouched
  issue: "113"
  given:
    - sql: |
        INSERT INTO households (id, household_display_name, reporting_currency, period_start_day, day_starts_at, allowance_mode, expected_monthly_income)
        VALUES ('0192f0a0-0000-7000-8000-000000000002', 'Other Household', 'USD', 15, '06:30', 'fixed', 5000)
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request:
    method: PATCH
    path: /household
    headers:
      Content-Type: application/json
    body: '{"household_display_name":"Rumah Kita","reporting_currency":"EUR","period_start_day":28}'
  expect:
    status: 200
    body_json:
      id: 0192f0a0-0000-7000-8000-000000000001
      household_display_name: Rumah Kita
      reporting_currency: EUR
      period_start_day: 28
      day_starts_at: "04:00"
      allowance_mode: adaptive
    cookies: {}
    rows:
      - sql: |
          SELECT household_display_name, reporting_currency, period_start_day, to_char(day_starts_at, 'HH24:MI') AS day_starts_at,
                 allowance_mode, expected_monthly_income::text AS income, (updated_at = created_at) AS never_updated, (deleted_at IS NULL) AS live
          FROM households WHERE id = '0192f0a0-0000-7000-8000-000000000002'
        rows:
          - {household_display_name: Other Household, reporting_currency: USD, period_start_day: 15, day_starts_at: "06:30", allowance_mode: fixed, income: "5000.0000", never_updated: true, live: true}
      - sql: SELECT count(*)::int AS n FROM households
        rows: [{n: 2}]


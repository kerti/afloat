# `fixed`, not the `flat` this schema once had (CONTEXT, PRD §4). Nothing can
# write allowance_mode yet, so a row is the only way to reach it; /me and the
# PATCH's answer both report it. expected_monthly_income, when the row has one,
# is a string at exactly four decimal places.
- name: household - fixed and an income round-trip through patch and me
  issue: "113"
  given:
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
    - sql: UPDATE households SET allowance_mode = 'fixed', expected_monthly_income = 25000000
  request:
    method: PATCH
    path: /household
    headers:
      Content-Type: application/json
    body: '{"period_start_day":3}'
  expect:
    status: 200
    body_json:
      id: 0192f0a0-0000-7000-8000-000000000001
      household_display_name: Conformance Household
      reporting_currency: IDR
      period_start_day: 3
      day_starts_at: "04:00"
      expected_monthly_income: "25000000.0000"
      allowance_mode: fixed
    cookies: {}
    rows:
      - sql: SELECT allowance_mode, expected_monthly_income::text AS income FROM households
        rows: [{allowance_mode: fixed, income: "25000000.0000"}]


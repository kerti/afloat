  request: {"method": "PUT", "path": "/expenses/0192f0a0-0000-7000-8004-000000000001", "headers": {"Content-Type": "application/json"}, "body": "{\"amount\":\"1\"}"}
  expect:
    status: 405
    body_empty: true
    rows:
      - sql: "SELECT amount::text AS amount, (updated_at = '2026-01-01T00:00:00Z') AS untouched FROM expenses"
        rows: [{"amount": "25000.0000", "untouched": true}]


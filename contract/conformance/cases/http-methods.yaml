# /expenses/{id} serves PATCH (#140, PR 3b); GET, DELETE and the restore arrive with
# their slices. A verb the router does not serve there is a 405 that writes
# nothing, PUT (a replacement) and POST (an id is the client's, and a create is
# the collection's) among them.

- name: "http methods - PUT on one Expense is method not allowed and writes nothing"
  issue: "140"
  given:
    - sql: |
        INSERT INTO pockets (id, household_id, pocket_display_name) VALUES ('0192f0a0-0000-7000-8001-000000000001', '0192f0a0-0000-7000-8000-000000000001', 'OVO');
        INSERT INTO expenses (id, household_id, occurred_on, amount, currency, pocket_id, updated_at) VALUES ('0192f0a0-0000-7000-8004-000000000001', '0192f0a0-0000-7000-8000-000000000001', '2026-11-20', 25000, 'IDR', '0192f0a0-0000-7000-8001-000000000001', '2026-01-01T00:00:00Z')

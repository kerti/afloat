# The method rules #66 ruled: HEAD answers like GET (RFC 9110 §9.1); OPTIONS
# is a flat, content-free 405 everywhere - a registered route, an unregistered
# path, and the disabled-login route alike, so none of the three can be told
# apart by the one header (Allow) that would otherwise vary; and the actuator
# is not exposed over HTTP at all.

- name: http methods - HEAD answers like GET
  issue: "66"
  request:
    method: HEAD
    path: /health
  expect:
    status: 200
    body_empty: true
    headers:
      Content-Type: application/json

- name: http methods - HEAD on a POST-only route is method not allowed
  issue: "66"
  request:
    method: HEAD
    path: /auth/logout
  expect:
    status: 405
    body_empty: true

- name: http methods - OPTIONS on a registered route is method not allowed, no Allow
  issue: "66"
  request:
    method: OPTIONS
    path: /health
  expect:
    status: 405
    body_empty: true
    headers:
      Allow: ""

- name: http methods - OPTIONS on an unregistered path is method not allowed, no Allow
  issue: "66"
  request:
    method: OPTIONS
    path: /no-such-route
  expect:
    status: 405
    body_empty: true
    headers:
      Allow: ""

- name: http methods - OPTIONS on local login (enabled) is method not allowed, no Allow
  issue: "66"
  request:
    method: OPTIONS
    path: /auth/local/login
  expect:
    status: 405
    body_empty: true
    headers:
      Allow: ""

# The second-review finding this ruling settles: OPTIONS on the disabled-login
# route must be indistinguishable from OPTIONS on a path that was never
# registered - same_as makes that a relation, not a repeated byte assertion.
- name: http methods - OPTIONS on local login (disabled) matches an unregistered path
  issue: "66"
  profile: local-disabled
  request:
    method: OPTIONS
    path: /auth/local/login
  expect:
    status: 405
    same_as:
      method: OPTIONS
      path: /no-such-route

# S1: OptionsRefusedFilter never gets a chance to run on a path the firewall
# refuses (`;x`, `//`, `%2e%2e`, `%2F`) - the firewall refuses it before
# FilterChainProxy dispatches into the filter chain at all - so Kotlin's
# requestRejectedHandler special-cases OPTIONS to answer the same flat 405
# there too. same_as (not same_as_for): both backends now agree, so the
# relation holds identically on each - this backend's answer to the malformed
# path equals its own answer to an ordinary OPTIONS. Run on both profiles: the
# disabled-login gate being off must not change what a firewall-refused
# OPTIONS answers either.
- name: http methods - OPTIONS on a firewall-refused path matches an ordinary OPTIONS
  issue: "66"
  request:
    method: OPTIONS
    path: /health;x=1
  expect:
    status: 405
    same_as:
      method: OPTIONS
      path: /health

- name: http methods - OPTIONS on a double slash matches an ordinary OPTIONS
  issue: "66"
  request:
    method: OPTIONS
    path: //health
  expect:
    status: 405
    same_as:
      method: OPTIONS
      path: /health

- name: http methods - OPTIONS on a dot segment matches an ordinary OPTIONS
  issue: "66"
  request:
    method: OPTIONS
    path: /%2e%2e/health
  expect:
    status: 405
    same_as:
      method: OPTIONS
      path: /health

- name: http methods - OPTIONS on an encoded slash matches an ordinary OPTIONS
  issue: "66"
  request:
    method: OPTIONS
    path: /auth%2Fmethods
  expect:
    status: 405
    same_as:
      method: OPTIONS
      path: /health

- name: http methods - OPTIONS on a firewall-refused path matches an ordinary OPTIONS (local login disabled)
  issue: "66"
  profile: local-disabled
  request:
    method: OPTIONS
    path: /health;x=1
  expect:
    status: 405
    same_as:
      method: OPTIONS
      path: /health

- name: http methods - OPTIONS on a double slash matches an ordinary OPTIONS (local login disabled)
  issue: "66"
  profile: local-disabled
  request:
    method: OPTIONS
    path: //health
  expect:
    status: 405
    same_as:
      method: OPTIONS
      path: /health

- name: http methods - OPTIONS on a dot segment matches an ordinary OPTIONS (local login disabled)
  issue: "66"
  profile: local-disabled
  request:
    method: OPTIONS
    path: /%2e%2e/health
  expect:
    status: 405
    same_as:
      method: OPTIONS
      path: /health

- name: http methods - OPTIONS on an encoded slash matches an ordinary OPTIONS (local login disabled)
  issue: "66"
  profile: local-disabled
  request:
    method: OPTIONS
    path: /auth%2Fmethods
  expect:
    status: 405
    same_as:
      method: OPTIONS
      path: /health

# The one connector-level shape (#64) under OPTIONS: Go's optionsRefused
# intercepts every OPTIONS before path validity is even examined, so it still
# answers 405 (matching every other OPTIONS, via same_as_for); Tomcat's
# connector refuses %00 before Spring's filter chain - OptionsRefusedFilter
# included - ever runs, so Kotlin still answers its connector-level 400.
- name: http methods - OPTIONS on a connector-refused path is a permitted connector-vs-router difference
  issue: "64"
  permit: [malformed-path-connector-400]
  request:
    method: OPTIONS
    path: /health%00
  expect:
    status_by_backend: {go: 405, kotlin: 400}
    same_as_for:
      go:
        method: OPTIONS
        path: /health

# The first 405 case in the harness (#66's acceptance criterion): a wrong
# method on a route that exists, Go's chi default answered before this ruling
# and after it alike, pinned as the reference both backends must give.
# S2: OPTIONS * (RFC 9110 §7.1) is answered by the connector itself on both
# backends, before Handler/the filter chain gets a look - see the
# `options-star` permitted difference for why neither can be made to match
# the other's bytes.
- name: http methods - OPTIONS star is a permitted connector difference
  issue: "66"
  permit: [options-star]
  request:
    method: OPTIONS
    raw_target: "*"
  expect:
    status_by_backend: {go: 405, kotlin: 200}
    same_as_for:
      go:
        method: OPTIONS
        path: /health

- name: http methods - PUT on GET-only /health is method not allowed
  issue: "66"
  request:
    method: PUT
    path: /health
  expect:
    status: 405
    body_empty: true

# #66 item 4: actuator is a ratified dependency (BOOTSTRAP.md §3) that answers
# nothing over HTTP. Kotlin's management.server.port: -1 leaves no controller
# mapping it, so it falls through to the same "no handler mapped this path"
# 404 any unregistered path gets; Go never had it to begin with.
- name: http methods - actuator is an unregistered path, unauthenticated
  issue: "66"
  permit: [unmatched-path-404]
  request:
    method: GET
    path: /actuator/health
  expect:
    status: 404
    same_as: &no-such-get
      method: GET
      path: /no-such-route

- name: http methods - actuator is an unregistered path, signed in
  issue: "66"
  permit: [unmatched-path-404]
  given:
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request:
    method: GET
    path: /actuator/health
  expect:
    status: 404
    same_as: *no-such-get

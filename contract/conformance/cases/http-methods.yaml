# The method rules #66 ruled: HEAD answers like GET (RFC 9110 §9.1); OPTIONS
# is a flat, content-free 405 everywhere - a registered route, an unregistered
# path, and the disabled-login route alike, so none of the three can be told
# apart by the one header (Allow) that would otherwise vary.

- name: http methods - HEAD answers like GET
  issue: "66"
  request:
    method: HEAD
    path: /health
  expect:
    status: 200
    body_empty: true
    headers:
      Content-Type: application/json

- name: http methods - HEAD on a POST-only route is method not allowed
  issue: "66"
  request:
    method: HEAD
    path: /auth/logout
  expect:
    status: 405
    body_empty: true

- name: http methods - OPTIONS on a registered route is method not allowed, no Allow
  issue: "66"
  request:
    method: OPTIONS
    path: /health
  expect:
    status: 405
    body_empty: true
    headers:
      Allow: ""

- name: http methods - OPTIONS on an unregistered path is method not allowed, no Allow
  issue: "66"
  request:
    method: OPTIONS
    path: /no-such-route
  expect:
    status: 405
    body_empty: true
    headers:
      Allow: ""

- name: http methods - OPTIONS on local login (enabled) is method not allowed, no Allow
  issue: "66"
  request:
    method: OPTIONS
    path: /auth/local/login
  expect:
    status: 405
    body_empty: true
    headers:
      Allow: ""

# The second-review finding this ruling settles: OPTIONS on the disabled-login
# route must be indistinguishable from OPTIONS on a path that was never
# registered - same_as makes that a relation, not a repeated byte assertion.
- name: http methods - OPTIONS on local login (disabled) matches an unregistered path
  issue: "66"
  profile: local-disabled
  request:
    method: OPTIONS
    path: /auth/local/login
  expect:
    status: 405
    same_as:
      method: OPTIONS
      path: /no-such-route

# #66 second review: OPTIONS on a path that names no route (`;x`, `//`,
# `%2e%2e`, `%2F`) answers the same flat 405 as any other OPTIONS - the answer
# to the odd path equals the answer to an ordinary OPTIONS. Run on both
# profiles: the disabled-login gate being off must not change what such an
# OPTIONS answers either.
- name: http methods - OPTIONS on a path parameter matches an ordinary OPTIONS
  issue: "66"
  request:
    method: OPTIONS
    path: /health;x=1
  expect:
    status: 405
    same_as:
      method: OPTIONS
      path: /health

- name: http methods - OPTIONS on a double slash matches an ordinary OPTIONS
  issue: "66"
  request:
    method: OPTIONS
    path: //health
  expect:
    status: 405
    same_as:
      method: OPTIONS
      path: /health

- name: http methods - OPTIONS on a dot segment matches an ordinary OPTIONS
  issue: "66"
  request:
    method: OPTIONS
    path: /%2e%2e/health
  expect:
    status: 405
    same_as:
      method: OPTIONS
      path: /health

- name: http methods - OPTIONS on an encoded slash matches an ordinary OPTIONS
  issue: "66"
  request:
    method: OPTIONS
    path: /auth%2Fmethods
  expect:
    status: 405
    same_as:
      method: OPTIONS
      path: /health

- name: http methods - OPTIONS on a path parameter matches an ordinary OPTIONS (local login disabled)
  issue: "66"
  profile: local-disabled

# The method rules #66 ruled: HEAD answers like GET (RFC 9110 §9.1); OPTIONS
# is a flat, content-free 405 everywhere - a registered route, an unregistered
# path, and the disabled-login route alike, so none of the three can be told
# apart by the one header (Allow) that would otherwise vary.

- name: http methods - HEAD answers like GET
  issue: "66"
  request:
    method: HEAD
    path: /health
  expect:
    status: 200
    body_empty: true
    headers:
      Content-Type: application/json

- name: http methods - HEAD on a POST-only route is method not allowed
  issue: "66"
  request:
    method: HEAD
    path: /auth/logout
  expect:
    status: 405
    body_empty: true

- name: http methods - OPTIONS on a registered route is method not allowed, no Allow
  issue: "66"
  request:
    method: OPTIONS
    path: /health
  expect:
    status: 405
    body_empty: true
    headers:
      Allow: ""

- name: http methods - OPTIONS on an unregistered path is method not allowed, no Allow
  issue: "66"
  request:
    method: OPTIONS
    path: /no-such-route
  expect:
    status: 405
    body_empty: true
    headers:
      Allow: ""

- name: http methods - OPTIONS on local login (enabled) is method not allowed, no Allow
  issue: "66"
  request:
    method: OPTIONS
    path: /auth/local/login
  expect:
    status: 405
    body_empty: true
    headers:
      Allow: ""

# The second-review finding this ruling settles: OPTIONS on the disabled-login
# route must be indistinguishable from OPTIONS on a path that was never
# registered - same_as makes that a relation, not a repeated byte assertion.
- name: http methods - OPTIONS on local login (disabled) matches an unregistered path
  issue: "66"
  profile: local-disabled
  request:
    method: OPTIONS
    path: /auth/local/login
  expect:
    status: 405
    same_as:
      method: OPTIONS
      path: /no-such-route

# #66 second review: OPTIONS on a path that names no route (`;x`, `//`,
# `%2e%2e`, `%2F`) answers the same flat 405 as any other OPTIONS - the answer
# to the odd path equals the answer to an ordinary OPTIONS. Run on both
# profiles: the disabled-login gate being off must not change what such an
# OPTIONS answers either.
- name: http methods - OPTIONS on a path parameter matches an ordinary OPTIONS
  issue: "66"
  request:
    method: OPTIONS
    path: /health;x=1
  expect:
    status: 405
    same_as:
      method: OPTIONS
      path: /health

- name: http methods - OPTIONS on a double slash matches an ordinary OPTIONS
  issue: "66"
  request:
    method: OPTIONS
    path: //health
  expect:
    status: 405
    same_as:
      method: OPTIONS
      path: /health

- name: http methods - OPTIONS on a dot segment matches an ordinary OPTIONS
  issue: "66"
  request:
    method: OPTIONS
    path: /%2e%2e/health
  expect:
    status: 405
    same_as:
      method: OPTIONS
      path: /health

- name: http methods - OPTIONS on an encoded slash matches an ordinary OPTIONS
  issue: "66"
  request:
    method: OPTIONS
    path: /auth%2Fmethods
  expect:
    status: 405
    same_as:
      method: OPTIONS
      path: /health

- name: http methods - OPTIONS on a path parameter matches an ordinary OPTIONS (local login disabled)
  issue: "66"
  profile: local-disabled
  request:
    method: OPTIONS
    path: /health;x=1
  expect:
    status: 405
    same_as:
      method: OPTIONS
      path: /health

- name: http methods - OPTIONS on a double slash matches an ordinary OPTIONS (local login disabled)
  issue: "66"
  profile: local-disabled
  request:
    method: OPTIONS
    path: //health
  expect:
    status: 405
    same_as:
      method: OPTIONS
      path: /health

- name: http methods - OPTIONS on a dot segment matches an ordinary OPTIONS (local login disabled)
  issue: "66"
  profile: local-disabled
  request:
    method: OPTIONS
    path: /%2e%2e/health
  expect:
    status: 405
    same_as:
      method: OPTIONS
      path: /health

- name: http methods - OPTIONS on an encoded slash matches an ordinary OPTIONS (local login disabled)
  issue: "66"
  profile: local-disabled
  request:
    method: OPTIONS
    path: /auth%2Fmethods
  expect:
    status: 405
    same_as:
      method: OPTIONS
      path: /health

# The malformed path shapes (#64) under OPTIONS: optionsRefused intercepts
# every OPTIONS before path validity is even examined, so each still answers
# the flat 405 every other OPTIONS gets.
- name: http methods - OPTIONS on a malformed path (%00) is refused like every other OPTIONS
  issue: "64"
  request:
    method: OPTIONS
    path: /health%00
  expect:
    status: 405
    same_as:
      method: OPTIONS
      path: /health

- name: http methods - OPTIONS on a malformed path (a literal backslash) is refused like every other OPTIONS
  issue: "64"
  request:
    method: OPTIONS
    raw_target: /health\
  expect:
    status: 405
    same_as:
      method: OPTIONS
      path: /health

- name: http methods - OPTIONS on a malformed path (invalid UTF-8, %FF) is refused like every other OPTIONS
  issue: "64"
  request:
    method: OPTIONS
    path: /health%FF
  expect:
    status: 405
    same_as:
      method: OPTIONS
      path: /health

- name: http methods - OPTIONS on a malformed path (overlong %C0%AF) is refused like every other OPTIONS
  issue: "64"
  request:
    method: OPTIONS
    path: /health%C0%AF
  expect:
    status: 405
    same_as:
      method: OPTIONS
      path: /health

- name: http methods - OPTIONS on a malformed path (a raw non-ASCII byte sequence) is refused like every other OPTIONS
  issue: "64"
  request:
    method: OPTIONS
    raw_target: /healthé
  expect:
    status: 405
    same_as:
      method: OPTIONS
      path: /health

# #66: OPTIONS * (RFC 9110 §7.1). net/http would answer it itself, before
# Handler runs; main.go turns that off (DisableGeneralOptionsHandler) so it
# gets the same flat 405 as every other OPTIONS.
- name: http methods - OPTIONS star is refused like every other OPTIONS
  issue: "66"
  request:
    method: OPTIONS
    raw_target: "*"
  expect:
    status: 405
    same_as:
      method: OPTIONS
      path: /health

# Ruling 2 (26 Sep): every asterisk-form shape measured beyond the bare
# "OPTIONS *" above. A non-OPTIONS method with target "*" is not RFC 9110
# §7.1's asterisk-form at all (that section reserves it for OPTIONS) - the
# router simply has no route for it and answers its bare 404.
- name: http methods - GET star answers like an unregistered path
  issue: "64"
  request:
    method: GET
    raw_target: "*"
  expect:
    status: 404
    same_as:
      method: GET
      path: /no-such-route

- name: http methods - HEAD star answers like an unregistered path
  issue: "64"
  request:
    method: HEAD
    raw_target: "*"
  # No same_as, unlike its siblings: "*" never reaches the /api mount, so
  # headAsGet never runs and net/http counts the fallback 404's 19-byte
  # body into Content-Length, where HEAD /no-such-route (under /api) goes
  # through headAsGet's discarding writer and sends none. No Path or
  # RawTarget can name a request outside the base, so body_empty is the pin.
  expect:
    status: 404
    body_empty: true

- name: http methods - POST star answers like an unregistered path
  issue: "64"
  request:
    method: POST
    raw_target: "*"
  expect:
    status: 404
    same_as:
      method: POST
      path: /no-such-route

- name: http methods - TRACE star answers like an unregistered path
  issue: "64"
  request:
    method: TRACE
    raw_target: "*"
  expect:
    status: 404
    same_as:
      method: TRACE
      path: /no-such-route

# OPTIONS *?x=1 is not the bare asterisk-form RFC 9110 §7.1 describes either -
# it is invalid enough that Go's own request-line parser refuses it before
# Handler runs at all (a bare 400 text/plain, the same class as a raw C0
# control byte in a header). same_as: it answers any other
# asterisk-form-with-query the same way, since the answer does not depend on
# the query's own content.
- name: http methods - OPTIONS star with a query string is refused by the request-line parser
  issue: "66"
  request:
    method: OPTIONS
    raw_target: "*?x=1"
  expect:
    status: 400
    same_as:
      method: OPTIONS
      raw_target: "*?y=2"

# OPTIONS http://x* is absolute-form (RFC 9110 §7.1), not asterisk-form -
# optionsRefused answers every OPTIONS the same flat 405 regardless of the
# request-target's shape.
- name: http methods - OPTIONS to an absolute-form target ending in a star is refused like every other OPTIONS
  issue: "66"
  request:
    method: OPTIONS
    raw_target: "http://x*"
  expect:
    status: 405
    same_as:
      method: OPTIONS
      path: /health

# A wrong method on a route that exists (#66's acceptance criterion).
- name: http methods - PUT on GET-only /health is method not allowed
  issue: "66"
  request:
    method: PUT
    path: /health
  expect:
    status: 405
    body_empty: true

# `found` is a boolean and the body declares nothing else: a later join choice
# adds properties to the contract, not a different shape.
- name: onboarding choice with a non-boolean found is INVALID_JSON_BODY
  issue: "108"
  given:
    - request: *register-dewi
      status: 204
  request:
    method: POST
    path: /onboarding/choice
    headers:
      Content-Type: application/json
    body: '{"found":"true","household_name":"Rumah"}'
  expect:
    status: 400
    body_json: {code: INVALID_JSON_BODY}
    cookies: {}
    rows: *handshake-kept

- name: onboarding choice naming a join is INVALID_JSON_BODY, invitations being a later slice
  issue: "108"
  given:
    - request: *register-dewi
      status: 204
  request:
    method: POST
    path: /onboarding/choice
    headers:
      Content-Type: application/json
    body: '{"join":true,"invitation_id":"0192f0a0-0000-7000-8000-0000000000e1"}'
  expect:
    status: 400
    body_json: {code: INVALID_JSON_BODY}
    cookies: {}
    rows: *handshake-kept

# Taken between register and commit. The Household inserted ahead of the failing
# User must not survive: the whole founding rolled back, and the handshake with it.
- name: onboarding choice with the address taken since registering is EMAIL_TAKEN and creates nothing
  issue: "108"
  given:
    - request: *register-dewi
      status: 204
    - sql: |
        INSERT INTO users (id, household_id, email, display_name)
        VALUES ('0192f0a0-0000-7000-8000-0000000000d1', '0192f0a0-0000-7000-8000-000000000001', 'DEWI@example.com', 'Raced')
  request:
    method: POST
    path: /onboarding/choice
    headers:
      Content-Type: application/json
    body: '{"found":true,"household_name":"Rumah"}'
  expect:
    status: 409
    body_json: {code: EMAIL_TAKEN}
    cookies: {}
    rows:
      - sql: |
          SELECT (SELECT count(*) FROM households)::int AS households, (SELECT count(*) FROM users)::int AS users,
                 (SELECT count(*) FROM credentials)::int AS credentials, (SELECT count(*) FROM sessions)::int AS sessions,
                 (SELECT count(*) FROM onboarding_handshakes)::int AS handshakes
        rows: [{households: 1, users: 4, credentials: 2, sessions: 0, handshakes: 1}]

- name: onboarding choice - a cross-site request is blocked
  issue: "108"
  given:
    - request: *register-dewi
      status: 204
  request:
    method: POST
    path: /onboarding/choice
    headers:
      Content-Type: application/json
      Sec-Fetch-Site: cross-site
    body: '{"found":true,"household_name":"Rumah"}'
  expect:
    status: 403
    body_json: {code: CROSS_SITE_REQUEST_BLOCKED}
    cookies: {}
    rows: *handshake-kept

# FOUNDING_DISABLED: registration and the gate still work, the founding does not.
- name: founding disabled - auth methods reports founding closed
  issue: "108"
  profile: founding-disabled
  request:
    method: GET
    path: /auth/methods
  expect:
    status: 200
    body_json: {local: true, google: false, founding_open: false}

- name: founding disabled - the gate reports founding closed
  issue: "108"
  profile: founding-disabled
  given:
    - request: *register-dewi
      status: 204
  request:
    method: GET
    path: /onboarding/options
  expect:
    status: 200
    body_json: {email: dewi@example.com, display_name: Dewi Putri, founding_open: false}

- name: founding disabled - the commit is FOUNDING_DISABLED and spends nothing
  issue: "108"
  profile: founding-disabled
  given:
    - request: *register-dewi
      status: 204
  request:
    method: POST
    path: /onboarding/choice
    headers:
      Content-Type: application/json
    body: '{"found":true,"household_name":"Rumah"}'
  expect:
    status: 403
    body_json: {code: FOUNDING_DISABLED}
    cookies: {}
    rows: *handshake-kept

# An absent handshake is answered first, so a stranger learns nothing of the
# instance's posture from a 403.
- name: founding disabled - the commit with no handshake is still UNAUTHORIZED
  issue: "108"
  profile: founding-disabled
  request:
    method: POST
    path: /onboarding/choice
    headers:
      Content-Type: application/json
    body: '{"found":true,"household_name":"Rumah"}'
  expect:
    status: 401
    body_json: {code: UNAUTHORIZED}
    cookies: {}

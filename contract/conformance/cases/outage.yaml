# The database, not the caller, is the problem (#23, #27). An outage is never
# a statement about an account: no cookie is cleared, no failure is counted
# against an address. Login answers 500 INTERNAL (#23). A session that cannot
# be read is not an invalid one: a route that needs it answers 500 INTERNAL,
# cookie untouched, so the same token works once the database is back (#27).
#
# `outage: true` terminates every connection the backend holds to its
# database and refuses new ones, until the request has been answered; the
# rows are read after the database is back.

- name: outage - health is 503 degraded
  given:
    - outage: true
  request:
    method: GET
    path: /health
  expect:
    status: 503
    body_json:
      status: degraded
      version: dev
    cookies: {}

# Nothing in it touches the database.
- name: outage - auth methods still answers
  given:
    - outage: true
  request:
    method: GET
    path: /auth/methods
  expect:
    status: 200
    body_json: {local: true, google: false, founding_open: true}
    cookies: {}

- name: outage - login is 500 and burns no backoff
  issue: "23"
  given:
    - outage: true
  request:
    method: POST
    path: /auth/local/login
    headers:
      Content-Type: application/json
    body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
  expect:
    status: 500
    body_json: {code: INTERNAL}
    cookies: {}
    rows:
      - sql: SELECT (SELECT count(*) FROM sessions)::int AS sessions, (SELECT count(*) FROM login_attempts)::int AS attempts
        rows: [{sessions: 0, attempts: 0}]

# The session is unreadable, not invalid. A cleared cookie here would sign
# every user out for the length of the outage, and a 401 would tell the client
# to sign in again over a fault that is ours: 500, cookie kept, so the same
# cookie works once the database is back (#27).
- name: outage - me with a session is 500 and keeps the cookie
  issue: "27"
  given:
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
    - outage: true
  request:
    method: GET
    path: /me
  expect:
    status: 500
    body_json: {code: INTERNAL}
    cookies: {}
    rows:
      - sql: SELECT count(*)::int AS n FROM sessions
        rows: [{n: 1}]

- name: outage - logout with a session is 500 and keeps the cookie
  issue: "27"
  given:
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
    - outage: true
  request:
    method: POST
    path: /auth/logout
  expect:
    status: 500
    body_json: {code: INTERNAL}
    cookies: {}
    rows:
      - sql: SELECT count(*)::int AS n FROM sessions
        rows: [{n: 1}]

# Registration and the onboarding gate (#108). Like login, an outage is not a
# statement about the caller: 500, no cookie set or cleared, nothing recorded.
# The handshake cookie is the gate's credential, so a cleared one here would
# strand a person mid-onboarding for the length of the outage.
- name: outage - register is 500 and burns no backoff
  issue: "108"
  given:
    - outage: true
  request:
    method: POST
    path: /auth/local/register
    headers:
      Content-Type: application/json
    body: '{"email":"new@example.com","password":"kucing oranye di atap"}'
  expect:
    status: 500
    body_json: {code: INTERNAL}
    cookies: {}
    rows:
      - sql: SELECT (SELECT count(*) FROM onboarding_handshakes)::int AS handshakes, (SELECT count(*) FROM login_attempts)::int AS attempts
        rows: [{handshakes: 0, attempts: 0}]

- name: outage - onboarding options is 500 and keeps the handshake cookie
  issue: "108"
  given:
    - request:
        method: POST
        path: /auth/local/register
        headers:
          Content-Type: application/json
        body: '{"email":"new@example.com","password":"kucing oranye di atap"}'
      status: 204
    - outage: true
  request:
    method: GET
    path: /onboarding/options
  expect:
    status: 500
    body_json: {code: INTERNAL}
    cookies: {}
    rows:
      - sql: SELECT count(*)::int AS n FROM onboarding_handshakes
        rows: [{n: 1}]

- name: outage - onboarding choice is 500, keeps the handshake cookie and creates nothing
  issue: "108"
  given:
    - request:
        method: POST
        path: /auth/local/register
        headers:
          Content-Type: application/json
        body: '{"email":"new@example.com","password":"kucing oranye di atap"}'
      status: 204
    - outage: true
  request:
    method: POST
    path: /onboarding/choice
    headers:
      Content-Type: application/json
    body: '{"found":true,"household_display_name":"Rumah"}'
  expect:
    status: 500
    body_json: {code: INTERNAL}
    cookies: {}
    rows:
      - sql: |
          SELECT (SELECT count(*) FROM households)::int AS households, (SELECT count(*) FROM users)::int AS users,
                 (SELECT count(*) FROM sessions)::int AS sessions, (SELECT count(*) FROM onboarding_handshakes)::int AS handshakes
        rows: [{households: 1, users: 3, sessions: 0, handshakes: 1}]

# The session is unreadable, so the answer is 500 and the cookie is kept, as
# for every route that needs one (#27). The Budget's own failures (a Period that
# will not materialise whole) are the backend's suite's.
- name: outage - budget with a session is 500 and writes nothing
  issue: "130"
  given:
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
    - outage: true
  request:
    method: GET
    path: /budget
  expect:
    status: 500
    body_json: {code: INTERNAL}
    cookies: {}
    rows:
      - sql: SELECT (SELECT count(*) FROM budgets)::int AS budgets, (SELECT count(*) FROM monthly_budgets)::int AS versions
        rows: [{budgets: 0, versions: 0}]

- name: outage - a budget change with a session is 500 and writes nothing
  issue: "130"
  given:
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
    - outage: true
  request:
    method: PATCH
    path: /budget
    headers:
      Content-Type: application/json
    body: '{"monthly_budget":"9000000"}'
  expect:
    status: 500
    body_json: {code: INTERNAL}
    cookies: {}
    rows:
      - sql: SELECT (SELECT count(*) FROM budgets)::int AS budgets, (SELECT count(*) FROM monthly_budgets)::int AS versions
        rows: [{budgets: 0, versions: 0}]

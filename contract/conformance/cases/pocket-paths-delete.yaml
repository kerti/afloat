# The path-parameter table of #106 item 1, run against DELETE /pockets/{id}: the
# mutating verb a mis-decoded id would hurt (pocket-paths.yaml runs the same
# shapes against PATCH), through the real router and the generated binder. #65
# ruled that a parameter is percent-decoded exactly once, so every odd shape
# reaches the handler, and for a uuid the binder refuses all that is not one.
#
# Observed, and pinned here (the same answers as PATCH gives):
#   - %2541, %25, 100%25 bind %41, %, 100%: 400 VALIDATION {field: id, rule: invalid}.
#   - %2F, %2f, ;, %3B, %2e%2e, %5C, %00 and a literal backslash: also 400
#     invalid, the binder's answer where {id} matches (#56's "a path that does
#     not exist" is for shapes no route can match).
#   - A trailing slash and an empty parameter match no route: a bare 404.
#   - The spellings uuid.Parse accepts (upper case, urn:uuid:, braces, 32 hex, a
#     percent-encoded first digit) name the same Pocket and are accepted: the
#     Pocket is deleted.
#   - HEAD is not repeated here: no GET exists on this path, and pocket-paths.yaml
#     pins its 405.
# Every row asserts the Pocket row after the request: a refusal leaves it live
# and untouched, an accepted spelling deletes it.
#
# The restore route has its own binder call; the last rows run the shapes that
# differ there. One is a SURPRISE against the issue's inference (P10): an empty
# parameter, /pockets//restore, is not "a path that does not exist": {id} matches
# the empty segment and the binder refuses it, 400 invalid.
#
# The Pocket every case starts with: 0192f0a0-0000-7000-8001-000000000001, OVO,
# Household 1, active.

- name: "pocket paths delete - %2541 binds %41, which is not a uuid is a malformed id"
  issue: "106"
  given: &seeded
    - sql: INSERT INTO pockets (id, household_id, pocket_display_name, created_at, updated_at) VALUES ('0192f0a0-0000-7000-8001-000000000001', '0192f0a0-0000-7000-8000-000000000001', 'OVO', '2026-01-01T00:00:00Z', '2026-01-01T00:00:00Z')
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request:
    method: DELETE
    path: /pockets/%2541
  expect:
    status: 400
    body_json: {code: VALIDATION, args: {field: id, rule: invalid}}
    cookies: {}
    rows:
      - sql: SELECT pocket_display_name AS name, active, (deleted_at IS NOT NULL) AS deleted, (updated_at = created_at) AS untouched FROM pockets
        rows: [{name: OVO, active: true, deleted: false, untouched: true}]



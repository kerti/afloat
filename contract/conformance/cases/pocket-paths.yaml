# The path-parameter table of #106 item 1, run against the first {id} route,
# PATCH /pockets/{id}: how every shape of a path parameter is answered, through
# the real router and the generated binder. #65 ruled that a parameter is
# percent-decoded exactly once (option (b), refusing odd shapes up front, was not
# taken, so they reach the handler); for a uuid the binder refuses everything
# that is not one.
#
# Observed, and pinned here:
#   - %2541, %25, 100%25 bind %41, %, 100%: 400 VALIDATION {field: id, rule: invalid}.
#   - %2F, %2f, ;, %3B, %2e%2e, %5C, %00 and a literal backslash: also 400
#     invalid. They are "a path that does not exist" (#56) only where no route
#     can match them; here {id} matches, so the binder refuses them. #65 and
#     #106 do not split on a {id} route: every one is the same 400.
#   - A trailing slash and an empty parameter match no route: a bare 404, the
#     answer an unregistered path gives (same_as).
#   - HEAD: 405. There is no GET on this path to answer it.
#   - The spellings uuid.Parse accepts (upper case, urn:uuid:, braces, 32 hex,
#     a percent-encoded first digit) name the same Pocket and are accepted.
#     Refusing them would take a `pattern` on the path parameter, which the
#     validator would check on the ENCODED form and so refuse %30192f..., the
#     encoded spelling of a valid id (#106 item 2). The body id of a create has
#     the pattern instead.
# Every row asserts the Pocket row: a mis-decoded id is a hazard to a write.
#
# The Pocket every case starts with: 0192f0a0-0000-7000-8001-000000000001, OVO,
# Household 1, active. Beside it, so that deactivating OVO is not the Household's
# last active Pocket (#140 R1), an active Keeper (...00000a) no case touches. Every row
# assertion reads the whole table, so a request that touched the Keeper fails too.

- name: "pocket paths - %2541 binds %41, which is not a uuid is a malformed id"
  issue: "106"
  given: &seeded
    - sql: INSERT INTO pockets (id, household_id, pocket_display_name) VALUES ('0192f0a0-0000-7000-8001-000000000001', '0192f0a0-0000-7000-8000-000000000001', 'OVO'), ('0192f0a0-0000-7000-8001-00000000000a', '0192f0a0-0000-7000-8000-000000000001', 'Keeper')
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request:
    method: PATCH
    path: /pockets/%2541
    headers:
      Content-Type: application/json
    body: '{"active":false}'
  expect:
    status: 400
    body_json: {code: VALIDATION, args: {field: id, rule: invalid}}
    cookies: {}
    rows:
      - sql: SELECT pocket_display_name AS name, active FROM pockets ORDER BY pocket_display_name
        rows: [{name: Keeper, active: true}, {name: OVO, active: true}]



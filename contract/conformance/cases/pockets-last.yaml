# 409 LAST_POCKET (#140 R1): a Household always keeps at least one active, live
# Pocket, so a DELETE /pockets/{id} or a PATCH {"active": false} that would leave
# none is refused, with nothing changed (a rename sent beside the deactivation is
# refused with it). Deleting an inactive Pocket, deactivating one that is already
# inactive, renaming or reactivating, and a repeat delete of an already-deleted
# Pocket are never refused for this. NOT_FOUND is decided first: an unknown or
# another Household's id is the same 404 whether or not the caller has a last
# Pocket, and validation comes before both. The race (two removals of the last two
# Pockets cannot both pass) needs concurrent callers and is proven in the
# backend's own suite, which holds each transaction open at the interleaving.
#
# Seed A, a Household with one active Pocket (every case's `rows:` read every row):
#   0192f0a0-0000-7000-8001-000000000001  OVO     Household 1, live, active   (the last active one)
#   0192f0a0-0000-7000-8001-000000000002  Dana    Household 1, live, inactive
#   0192f0a0-0000-7000-8001-000000000003  Gopay   Household 1, deleted (while active)
#   0192f0a0-0000-7000-8001-000000000009  Theirs  Household 2, live, active   (its own last one)
# Seed B, two active Pockets: OVO (...01) and Keeper (...0a), both Household 1.
# `untouched` says whether updated_at still holds the seeded instant.

- name: "pocket last - deleting the last active Pocket is LAST_POCKET and changes nothing"
  issue: "140"
  given:
    - sql: |
        INSERT INTO households (id, household_display_name) VALUES ('0192f0a0-0000-7000-8000-000000000002', 'Other Household');
        INSERT INTO pockets (id, household_id, pocket_display_name, active, deleted_at, created_at, updated_at) VALUES
          ('0192f0a0-0000-7000-8001-000000000001', '0192f0a0-0000-7000-8000-000000000001', 'OVO',   true,  NULL,                   '2026-01-01T00:00:00Z', '2026-01-05T00:00:00Z'),
          ('0192f0a0-0000-7000-8001-000000000002', '0192f0a0-0000-7000-8000-000000000001', 'Dana',  false, NULL,                   '2026-01-02T00:00:00Z', '2026-01-05T00:00:00Z'),
          ('0192f0a0-0000-7000-8001-000000000003', '0192f0a0-0000-7000-8000-000000000001', 'Gopay', true,  '2026-01-05T00:00:00Z', '2026-01-03T00:00:00Z', '2026-01-05T00:00:00Z'),
          ('0192f0a0-0000-7000-8001-000000000009', '0192f0a0-0000-7000-8000-000000000002', 'Theirs', true, NULL,                   '2026-01-09T00:00:00Z', '2026-01-05T00:00:00Z')
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request:
    method: DELETE
    path: /pockets/0192f0a0-0000-7000-8001-000000000001
  expect:

# POST /pockets/{id}/restore (#121, PR 3 of 3): the Undo of a delete. Clears
# deleted_at and answers the Pocket with `active` as it was. Idempotent: a Pocket
# that is not deleted is 200, unchanged. A name another Pocket that is not
# deleted now holds (active or inactive, in any case) is 409 NAME_TAKEN and the
# Pocket stays deleted. An id that is unknown or another Household's is one 404
# NOT_FOUND, byte for byte; the id's shape is checked before the lookup.
#
# Under an outage the session itself cannot be read, which the session
# middleware answers 500 with the cookie left alone (#27).

# The Pockets a case starts with (every case, so a case also proves what it did
# NOT touch). Every updated_at is the same fixed instant, and a deleted Pocket's
# deleted_at is too, so `untouched` and `stamp_kept` say whether a request moved
# either:
#   0192f0a0-0000-7000-8001-000000000001  OVO     Household 1, live, active
#   0192f0a0-0000-7000-8001-000000000002  Dana    Household 1, live, inactive
#   0192f0a0-0000-7000-8001-000000000003  Gopay   Household 1, deleted, active
#   0192f0a0-0000-7000-8001-000000000004  Venmo   Household 1, deleted, inactive
#   0192f0a0-0000-7000-8001-000000000005  ovo     Household 1, deleted (OVO holds its name)
#   0192f0a0-0000-7000-8001-000000000006  DANA    Household 1, deleted (Dana, inactive, holds its name)
#   0192f0a0-0000-7000-8001-000000000007  theirs  Household 1, deleted (Household 2's live Theirs does not hold its name)
#   0192f0a0-0000-7000-8001-000000000008  Gone    Household 2, deleted
#   0192f0a0-0000-7000-8001-000000000009  Theirs  Household 2, live, active
#   0192f0a0-0000-7000-8001-00000000000a  Keeper  Household 1, live, active (so a case that deletes or deactivates OVO is not removing
#                                           the last active Pocket, #140 R1; pockets-last.yaml covers that rule)
# Only ASCII case folding is pinned: lower() follows the database's locale.


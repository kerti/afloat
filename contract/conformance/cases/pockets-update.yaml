# PATCH /pockets/{id} (#121, PR 2 of 3): rename, deactivate and reactivate. Merge
# semantics as PATCH /household (BOOTSTRAP.md §4): a property left out is
# unchanged, `{}` is a valid no-op, an unknown property is INVALID_JSON_BODY, the
# answer is the whole Pocket. Deactivating is not deleting: the Pocket keeps its
# name, stays in the list and still holds the name (inactive Pockets are
# listed, the client filters). An id that is unknown, another Household's or
# deleted is one 404 NOT_FOUND, the same bytes, for every body; validation comes
# before the lookup.
#
# The Pockets a case starts with (the same ids as pockets.yaml):
#   0192f0a0-0000-7000-8001-000000000001  OVO     Household 1, live, active
#   0192f0a0-0000-7000-8001-000000000002  Dana    Household 1, live, inactive
#   0192f0a0-0000-7000-8001-000000000003  Gopay   Household 1, deleted
#   0192f0a0-0000-7000-8001-000000000009  Theirs  Household 2, live, active
#   0192f0a0-0000-7000-8001-00000000000a  Keeper  Household 1, live, active (so a deactivation of OVO is not the last active Pocket's, #140 R1)
# `rows:` read every Pocket after the request, so a case also proves what it did
# NOT touch. Only ASCII case folding is pinned: lower() follows the database's
# locale.
#
# Under an outage the session itself cannot be read, which the session
# middleware answers 500 with the cookie left alone (#27); it never reaches the
# handler, whose own 500s the backend's suite covers.

- name: "pocket update - a rename answers the Pocket and changes only the name"
  issue: "121"
  given: &seeded
    - sql: |
        INSERT INTO households (id, household_display_name) VALUES ('0192f0a0-0000-7000-8000-000000000002', 'Other Household');
        INSERT INTO pockets (id, household_id, pocket_display_name, active, deleted_at, created_at) VALUES
          ('0192f0a0-0000-7000-8001-000000000001', '0192f0a0-0000-7000-8000-000000000001', 'OVO',    true,  NULL,  '2026-01-01T00:00:00Z'),
          ('0192f0a0-0000-7000-8001-000000000002', '0192f0a0-0000-7000-8000-000000000001', 'Dana',   false, NULL,  '2026-01-02T00:00:00Z'),
          ('0192f0a0-0000-7000-8001-000000000003', '0192f0a0-0000-7000-8000-000000000001', 'Gopay',  true,  now(), '2026-01-03T00:00:00Z'),
          ('0192f0a0-0000-7000-8001-000000000009', '0192f0a0-0000-7000-8000-000000000002', 'Theirs', true,  NULL,  '2026-01-04T00:00:00Z'),
          ('0192f0a0-0000-7000-8001-00000000000a', '0192f0a0-0000-7000-8000-000000000001', 'Keeper', true,  NULL,  '2026-01-10T00:00:00Z')
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request:
    method: PATCH
    path: /pockets/0192f0a0-0000-7000-8001-000000000001
    headers:
      Content-Type: application/json
    body: '{"pocket_display_name":"Cash"}'
  expect:
    status: 200
    body_json: {id: 0192f0a0-0000-7000-8001-000000000001, pocket_display_name: Cash, active: true}
    cookies: {}
    rows:
      - sql: SELECT id::text AS id, household_id::text AS household_id, pocket_display_name AS name, active, (deleted_at IS NOT NULL) AS deleted FROM pockets ORDER BY id
        rows:
          - {id: 0192f0a0-0000-7000-8001-000000000001, household_id: 0192f0a0-0000-7000-8000-000000000001, name: Cash, active: true, deleted: false}
          - {id: 0192f0a0-0000-7000-8001-000000000002, household_id: 0192f0a0-0000-7000-8000-000000000001, name: Dana, active: false, deleted: false}
          - {id: 0192f0a0-0000-7000-8001-000000000003, household_id: 0192f0a0-0000-7000-8000-000000000001, name: Gopay, active: true, deleted: true}
          - {id: 0192f0a0-0000-7000-8001-000000000009, household_id: 0192f0a0-0000-7000-8000-000000000002, name: Theirs, active: true, deleted: false}
          - {id: 0192f0a0-0000-7000-8001-00000000000a, household_id: 0192f0a0-0000-7000-8000-000000000001, name: Keeper, active: true, deleted: false}



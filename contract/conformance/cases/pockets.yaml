# GET and POST /pockets (#121, PR 1 of 3): the first domain entity, so the
# conventions every later entity copies (BOOTSTRAP.md §4): the client-supplied
# UUIDv7 is the idempotency key (201 first, 200 for a replay of a live Pocket of
# the Household, the STORED row, the rest of the body neither compared nor
# applied), an id held by something else is 409 ID_TAKEN (another Household's
# or the caller's own deleted one, one answer), a name already held by a Pocket
# that is not deleted is 409 NAME_TAKEN (inactive Pockets still hold theirs).
#
# The Household is always the session's, never the body's. fixtures/seed.sql holds
# one; a case that proves another is untouched adds a second in `given:`. `rows:`
# read the columns, because a response can be right while the row behind it is not.
#
# Only ASCII case folding is pinned (OVO/ovo): lower() follows the database's
# locale, so a non-ASCII row would pass on one host and fail on another.
#
# Under an outage the session itself cannot be read, which the session middleware
# answers 500 with the cookie left alone (#27); it never reaches the handler,
# whose own 500s the backend's suite covers.

# The Pockets a case starts with, inserted in `given:`. Fixed ids, so a body can
# name them.
#   0192f0a0-0000-7000-8001-000000000001  OVO      Household 1, live, active
#   0192f0a0-0000-7000-8001-000000000002  Dana     Household 1, live, inactive
#   0192f0a0-0000-7000-8001-000000000003  Gopay    Household 1, deleted
#   0192f0a0-0000-7000-8001-000000000009  Theirs   Household 2, live, active

- name: pockets - an empty Household lists items, not null
  issue: "121"
  given:
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request:
    method: GET
    path: /pockets
  expect:
    status: 200
    headers:
      Content-Type: application/json
    body_json: {items: []}
    cookies: {}
    rows:
      - sql: SELECT id::text AS id, household_id::text AS household_id, pocket_display_name AS name, active, (deleted_at IS NOT NULL) AS deleted FROM pockets ORDER BY id
        rows: []


- name: pockets - the list is in creation order, inactive ones included, deleted and foreign ones not
  issue: "121"
  given:
    - sql: |
        INSERT INTO households (id, household_display_name) VALUES ('0192f0a0-0000-7000-8000-000000000002', 'Other Household');
        INSERT INTO pockets (id, household_id, pocket_display_name, active, deleted_at, created_at) VALUES
          ('0192f0a0-0000-7000-8001-000000000001', '0192f0a0-0000-7000-8000-000000000001', 'OVO',    true,  NULL,  '2026-01-01T00:00:00Z'),
          ('0192f0a0-0000-7000-8001-000000000002', '0192f0a0-0000-7000-8000-000000000001', 'Dana',   false, NULL,  '2026-01-02T00:00:00Z'),
          ('0192f0a0-0000-7000-8001-000000000003', '0192f0a0-0000-7000-8000-000000000001', 'Gopay',  true,  now(), '2026-01-03T00:00:00Z'),
          ('0192f0a0-0000-7000-8001-000000000009', '0192f0a0-0000-7000-8000-000000000002', 'Theirs', true,  NULL,  '2026-01-04T00:00:00Z')
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request:
    method: GET
    path: /pockets
  expect:
    status: 200
    body_json:
      items:
        - {id: 0192f0a0-0000-7000-8001-000000000001, pocket_display_name: OVO, active: true}
        - {id: 0192f0a0-0000-7000-8001-000000000002, pocket_display_name: Dana, active: false}
    cookies: {}
    rows:
      - sql: SELECT id::text AS id, household_id::text AS household_id, pocket_display_name AS name, active, (deleted_at IS NOT NULL) AS deleted FROM pockets ORDER BY id
        rows:
          - {id: 0192f0a0-0000-7000-8001-000000000001, household_id: 0192f0a0-0000-7000-8000-000000000001, name: OVO, active: true, deleted: false}
          - {id: 0192f0a0-0000-7000-8001-000000000002, household_id: 0192f0a0-0000-7000-8000-000000000001, name: Dana, active: false, deleted: false}
          - {id: 0192f0a0-0000-7000-8001-000000000003, household_id: 0192f0a0-0000-7000-8000-000000000001, name: Gopay, active: true, deleted: true}
          - {id: 0192f0a0-0000-7000-8001-000000000009, household_id: 0192f0a0-0000-7000-8000-000000000002, name: Theirs, active: true, deleted: false}



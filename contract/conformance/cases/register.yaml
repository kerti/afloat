# POST /auth/local/register (contract: localRegister). Registration validates,
# hashes and parks the credential in an onboarding handshake: it creates no
# User, no Household and no session, so the seed's one Household, three Users and
# two credentials are all there is afterwards (#108).
#
# Validation order: the contract's own checks first (the email's shape,
# additionalProperties), then the password policy, then whether the address is
# held. The ip key is the harness's own loopback address; the row queries fold
# it to `register-ip:*`, as login.yaml does for `ip:*`.

- name: register opens a handshake and creates no account
  issue: "108"
  request:
    method: POST
    path: /auth/local/register
    headers:
      Content-Type: application/json
    body: '{"email":"new@example.com","password":"kucing oranye di atap","display_name":"Dewi Putri","locale":"id-ID"}'
  expect:
    status: 204
    body_empty: true
    cookies:
      afloat_onboarding: &handshake-cookie
        value_pattern: '[A-Za-z0-9_-]{43}'
        path: /
        max_age: 900
        http_only: true
        secure: false   # COOKIE_SECURE=false in the harness, which speaks plain HTTP
        same_site: Lax
        expires: max-age
    rows:
      - sql: |
          SELECT email, display_name, locale,
                 round(extract(epoch FROM expires_at - created_at))::int AS ttl_seconds,
                 left(password_hash, 31) AS hash_prefix,
                 length(id) AS id_length
          FROM onboarding_handshakes
        rows:
          - email: new@example.com
            display_name: Dewi Putri
            locale: id-ID
            ttl_seconds: 900
            hash_prefix: "$argon2id$v=19$m=19456,t=2,p=1$"
            # The SHA-256 hex of the cookie's token, never the token (43 chars).
            id_length: 64
      # Nothing but the seed exists: no Household, User, credential or session.
      - sql: |
          SELECT (SELECT count(*) FROM households)::int AS households, (SELECT count(*) FROM users)::int AS users,
                 (SELECT count(*) FROM credentials)::int AS credentials, (SELECT count(*) FROM sessions)::int AS sessions
        rows: [{households: 1, users: 3, credentials: 2, sessions: 0}]
      # One attempt, under its own key and not login's `ip:`.
      - sql: |
          SELECT regexp_replace(key, '^register-ip:.*', 'register-ip:*') AS key, failure_count,
                 round(extract(epoch FROM backoff_until - updated_at))::int AS window_seconds
          FROM login_attempts
        rows: [{key: "register-ip:*", failure_count: 1, window_seconds: 1}]

- name: register trims and case-folds the email, and defaults the display name and locale
  issue: "108"
  request:
    method: POST
    path: /auth/local/register
    headers:
      Content-Type: application/json
    body: '{"email":"  Dewi.Putri@Example.COM ","password":"kucing oranye di atap","display_name":"   ","locale":"fr-FR"}'
  expect:
    status: 204
    body_empty: true
    cookies:
      afloat_onboarding: *handshake-cookie
    rows:
      - sql: SELECT email, display_name, locale FROM onboarding_handshakes
        rows: [{email: dewi.putri@example.com, display_name: dewi.putri, locale: en-GB}]

# Not an enum in the contract: an unsupported locale is a fallback, not a failure.
- name: register with no locale falls back to en-GB
  issue: "108"
  request:
    method: POST
    path: /auth/local/register
    headers:
      Content-Type: application/json
    body: '{"email":"new@example.com","password":"kucing oranye di atap"}'
  expect:
    status: 204
    body_empty: true
    cookies:
      afloat_onboarding: *handshake-cookie
    rows:
      - sql: SELECT locale FROM onboarding_handshakes
        rows: [{locale: en-GB}]

- name: register - an email that is not an address is VALIDATION, whatever the password
  issue: "108"
  request:
    method: POST
    path: /auth/local/register
    headers:
      Content-Type: application/json
    body: '{"email":"not-an-address","password":"short"}'
  expect:
    status: 400
    body_json: {code: VALIDATION, args: {field: email, rule: email}}
    cookies: {}
    rows: &nothing-opened
      - sql: SELECT (SELECT count(*) FROM onboarding_handshakes)::int AS handshakes, (SELECT count(*) FROM login_attempts)::int AS attempts
        rows: [{handshakes: 0, attempts: 0}]


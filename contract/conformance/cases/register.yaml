- name: register - a password under ten code points is WEAK_PASSWORD min
  issue: "108"
  request:
    method: POST
    path: /auth/local/register
    headers:
      Content-Type: application/json
    body: '{"email":"new@example.com","password":"abcdefghi"}'
  expect:
    status: 400
    body_json: {code: WEAK_PASSWORD, args: {reason: min}}
    cookies: {}
    rows: *nothing-opened

# Counted in code points, not bytes: ten two-byte characters (20 bytes) clear
# the floor of ten, and nine (18 bytes) do not.
- name: register - the length floor counts code points, not bytes
  issue: "108"
  request:
    method: POST
    path: /auth/local/register
    headers:
      Content-Type: application/json
    body: '{"email":"new@example.com","password":"éééééééééé"}'
  expect:
    status: 204
    body_empty: true
    cookies:
      afloat_onboarding: *handshake-cookie

- name: register - nine two-byte characters are still under the floor

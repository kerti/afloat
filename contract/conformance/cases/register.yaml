# Registration enumerates by design (ruling on #108); login never does. A live
# User holds the address whether or not it has a credential (bob has none), in
# any case; a soft-deleted User's address is free again (carol).
- name: register - an address held by a live User is EMAIL_TAKEN
  issue: "108"
  request:
    method: POST
    path: /auth/local/register
    headers:
      Content-Type: application/json
    body: '{"email":"ALICE@example.com","password":"kucing oranye di atap"}'
  expect:
    status: 409
    body_json: {code: EMAIL_TAKEN}
    cookies: {}
    rows: *nothing-opened

- name: register - an address held by a User with no credential is EMAIL_TAKEN
  issue: "108"
  request:
    method: POST
    path: /auth/local/register
    headers:
      Content-Type: application/json
    body: '{"email":"bob@example.com","password":"kucing oranye di atap"}'
  expect:
    status: 409
    body_json: {code: EMAIL_TAKEN}
    cookies: {}
    rows: *nothing-opened

- name: register - a soft-deleted User's address is free
  issue: "108"
  request:
    method: POST
    path: /auth/local/register
    headers:
      Content-Type: application/json
    body: '{"email":"carol@example.com","password":"kucing oranye di atap"}'
  expect:
    status: 204
    body_empty: true
    cookies:
      afloat_onboarding: *handshake-cookie

# The per-IP backoff: a request that reaches the hash arms a window for its
# address, and one inside it is a 429 answered without a hash.
- name: register - a second registration inside the window is TOO_MANY_ATTEMPTS
  issue: "108"
  given:
    - request:
        method: POST
        path: /auth/local/register
        headers:
          Content-Type: application/json
        body: '{"email":"one@example.com","password":"kucing oranye di atap"}'
      status: 204
  request:
    method: POST
    path: /auth/local/register
    headers:
      Content-Type: application/json
    body: '{"email":"two@example.com","password":"kucing oranye di atap"}'
  expect:
    status: 429
    headers:
      Retry-After: "1"
    body_json: {code: TOO_MANY_ATTEMPTS}
    cookies: {}
    rows:
      - sql: SELECT email FROM onboarding_handshakes
        rows: [{email: one@example.com}]

# Its own key: a registration does not throttle a login from the same address.
- name: register does not arm the login backoff
  issue: "108"
  given:
    - request:
        method: POST
        path: /auth/local/register
        headers:
          Content-Type: application/json
        body: '{"email":"one@example.com","password":"kucing oranye di atap"}'
      status: 204
  request:
    method: POST
    path: /auth/local/login
    headers:
      Content-Type: application/json
    body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
  expect:
    status: 204
    body_empty: true
    cookies:
      afloat_session:
        value_pattern: '[A-Za-z0-9_-]{43}'
        path: /
        max_age: 2592000
        http_only: true
        secure: false
        same_site: Lax
        expires: max-age

- name: register - a cross-site request is blocked before it hashes
  issue: "108"
  request:
    method: POST
    path: /auth/local/register
    headers:
      Content-Type: application/json
      Sec-Fetch-Site: cross-site
    body: '{"email":"new@example.com","password":"kucing oranye di atap"}'
  expect:
    status: 403
    body_json: {code: CROSS_SITE_REQUEST_BLOCKED}
    cookies: {}
    rows: *nothing-opened

- name: register - GET is method not allowed
  issue: "108"
  request:
    method: GET
    path: /auth/local/register
  expect:
    status: 405

# The fixed response header set (#26, BOOTSTRAP.md §5.2), asserted by value.
# Each kind of answer that takes a different path out of the backend gets its
# own case: a handler's 200, an envelope from a handler, an envelope from a
# guard that answers before any handler runs, and the framework's own 404.
#
# Strict-Transport-Security must be absent, so the shared header set asserts
# it empty (an absent header reads as "").
#
# A minted X-Request-Id is random, so each request sends a clean id and
# expects it echoed: that pins the header on every path here, not just on
# /health.

- name: security headers on a handler's 200
  issue: "26"
  request:
    method: GET
    path: /health
    headers:
      X-Request-Id: conformance-probe
  expect:
    status: 200
    headers: &security-headers
      X-Content-Type-Options: nosniff
      X-Frame-Options: DENY
      Cache-Control: no-cache, no-store, max-age=0, must-revalidate
      Pragma: no-cache
      Expires: "0"
      X-XSS-Protection: "0"
      X-Request-Id: conformance-probe
      Strict-Transport-Security: ""
    body_json:
      status: ok
      version: dev

# The session probe the PWA polls: the response #26 names as the one whose
# cacheability actually matters.
- name: security headers on a handler's error envelope
  issue: "26"
  request:
    method: GET
    path: /me
    headers:
      X-Request-Id: conformance-probe
  expect:
    status: 401
    headers: *security-headers
    body_json:
      code: UNAUTHORIZED

# Answered by the CSRF guard before any handler runs, and on a POST.
- name: security headers on a guard's error envelope
  issue: "26"
  request:
    method: POST
    path: /auth/logout
    headers:
      Sec-Fetch-Site: cross-site
      X-Request-Id: conformance-probe
  expect:
    status: 403
    headers: *security-headers
    body_json:
      code: CROSS_SITE_REQUEST_BLOCKED
    rows:
      - sql: SELECT (SELECT count(*) FROM sessions)::int AS sessions, (SELECT count(*) FROM login_attempts)::int AS attempts
        rows: [{sessions: 0, attempts: 0}]

# The router's own unregistered-path 404, which no Afloat code writes. The
# body is no envelope by ruling (#24), so it is pinned the way that ruling's
# cases pin it: against the answer for a second unregistered path.
- name: security headers on an unregistered-path 404
  issue: "26"
  request:
    method: GET
    path: /no-such-route
    headers:
      X-Request-Id: conformance-probe
  expect:
    status: 404
    headers: *security-headers
    same_as:
      method: GET
      path: /no-such-route-either

# #70 (26 Sep ruling): sessions.user_agent's storage rule, in order - fold
# HTAB to SP and trim SP/HTAB from both ends; absent or empty is NULL (#32
# item 4, unchanged); not valid UTF-8 is NULL, because a Postgres TEXT column
# is UTF8-encoded and an invalid header used to fail the whole login with a
# 500 on Go and silent U+FFFD mojibake on Kotlin; otherwise truncated to 512
# Unicode code points, on a code point boundary. Login succeeds in every case
# here - the row is what changes, never the answer.
#
# The invalid-UTF-8 rows use headers_hex: a YAML string is Unicode text and
# cannot hold an invalid byte sequence directly (`\x85` in YAML means the
# code point U+0085, encoded as two valid UTF-8 bytes - not the raw byte
# 0x85), so these send the header's exact wire bytes as hex instead.
#
# The obs-fold rows (a real fold's CRLF) are NOT here: this harness's client
# is net/http, which refuses to put a raw CR or LF in a header value at all -
# obs_fold_test.go (Go) and ErrorDispatchSpec.kt (Kotlin) cover those over raw
# sockets against real servers instead.

- name: user-agent storage - a lone 0x85 is invalid UTF-8, stored as NULL
  issue: "70"
  request:
    method: POST
    path: /auth/local/login
    headers:
      Content-Type: application/json
    headers_hex:
      User-Agent: "788579"
    body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
  expect:
    status: 204
    body_empty: true
    cookies:
      afloat_session:
        value_pattern: '[A-Za-z0-9_-]{43}'
        path: /
        max_age: 2592000
        http_only: true
        secure: false
        same_site: Lax
        expires: max-age
    rows:
      - sql: SELECT user_agent FROM sessions
        rows: [{user_agent: null}]

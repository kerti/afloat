# The boundary rows: truncation happens on a whole code point, never a split
# sequence, whatever the eventual number of bytes turns out to be.
- name: user-agent storage - 511 code points is stored untouched
  issue: "70"
  request:
    method: POST
    path: /auth/local/login
    headers:
      Content-Type: application/json
      User-Agent: ""
    body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'

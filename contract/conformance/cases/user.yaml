  given:
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
    - request:
        method: PATCH
        path: /me
        headers:
          Content-Type: application/json
        body: '{"locale":"id-ID"}'
      status: 200
  request:
    method: PATCH
    path: /me
    headers:
      Content-Type: application/json
    body: '{"time_zone":"Asia/Jayapura"}'
  expect:
    status: 200
    body_json:
      id: 0192f0a0-0000-7000-8000-0000000000a1
      email: alice@example.com
      user_display_name: Alice
      locale: id-ID
      time_zone: Asia/Jayapura
      household: *the-household
    rows:
      - sql: SELECT user_display_name, locale, time_zone FROM users WHERE id = '0192f0a0-0000-7000-8000-0000000000a1'
        rows: [{user_display_name: Alice, locale: id-ID, time_zone: Asia/Jayapura}]


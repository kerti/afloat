- name: user settings - patch with an expired session is unauthorized
  issue: "119"
  given:
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
    - sql: UPDATE sessions SET expires_at = now() - interval '1 minute'
  request:
    method: PATCH
    path: /me
    headers:
      Content-Type: application/json
    body: '{"user_display_name":"Hijack"}'
  expect:
    status: 401
    body_json: {code: UNAUTHORIZED}
    rows:
      - sql: SELECT user_display_name FROM users WHERE id = '0192f0a0-0000-7000-8000-0000000000a1'
        rows: [{user_display_name: Alice}]

# The session cannot be read during an outage, so it is the middleware's 500
# (not the 401 of an invalid session), with the cookie left alone (#27), and
# nothing is written.
- name: user settings - patch during an outage is 500 and keeps the cookie
  issue: "119"
  given:
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
    - outage: true
  request:
    method: PATCH
    path: /me
    headers:
      Content-Type: application/json
    body: '{"user_display_name":"Dewi"}'
  expect:
    status: 500
    body_json: {code: INTERNAL}
    cookies: {}
    rows:
      - sql: SELECT user_display_name FROM users WHERE id = '0192f0a0-0000-7000-8000-0000000000a1'
        rows: [{user_display_name: Alice}]
      - sql: SELECT count(*)::int AS n FROM sessions
        rows: [{n: 1}]

# /me gains PATCH without losing GET; nothing else, and never a hard delete
# (BOOTSTRAP.md §4). `Allow` is set from the router's own tree.
- name: user settings - POST /me is method not allowed
  issue: "119"
  given: *signed-in
  request:
    method: POST
    path: /me
    headers:
      Content-Type: application/json
    body: '{"user_display_name":"Dewi"}'
  expect:
    status: 405
    body_empty: true
    rows: *alice-unchanged

- name: user settings - PUT /me is method not allowed

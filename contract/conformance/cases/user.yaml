# The session check runs before the body is looked at.
- name: user settings - patch with no session is unauthorized
  issue: "119"
  request:
    method: PATCH
    path: /me
    headers:
      Content-Type: application/json
    body: '{"user_display_name":"Hijack"}'
  expect:
    status: 401
    body_json: {code: UNAUTHORIZED}
    cookies: {}
    rows:
      - sql: SELECT user_display_name FROM users WHERE id = '0192f0a0-0000-7000-8000-0000000000a1'
        rows: [{user_display_name: Alice}]

- name: user settings - a bad body with no session is still unauthorized
  issue: "119"
  request:
    method: PATCH
    path: /me
    headers:
      Content-Type: application/json
    body: '{"nope":'
  expect:
    status: 401
    body_json: {code: UNAUTHORIZED}

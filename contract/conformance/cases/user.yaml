# Contract rules are judged before handler rules (BOOTSTRAP.md §5.1.1): the
# zone's `min` is the contract's, the name's `required` the handler's, so the
# zone is reported though the name sorts after it either way, and the other way
# round the name's `max` (the contract's) beats the zone's `timezone`.
- name: user settings - a contract failure is reported before a handler failure
  issue: "119"
  given: *signed-in
  request:
    method: PATCH
    path: /me
    headers:
      Content-Type: application/json
    body: '{"time_zone":"","user_display_name":" "}'
  expect:
    status: 400
    body_json: {code: VALIDATION, args: {field: time_zone, rule: min}}
    rows: *alice-unchanged

- name: user settings - where only handler rules fail, the least field is reported
  issue: "119"
  given: *signed-in
  request:
    method: PATCH
    path: /me
    headers:
      Content-Type: application/json
    body: '{"user_display_name":" ","time_zone":"Mars/Base"}'
  expect:
    status: 400
    body_json: {code: VALIDATION, args: {field: time_zone, rule: timezone}}
    rows: *alice-unchanged


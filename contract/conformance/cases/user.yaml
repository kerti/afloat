# Tenancy. bob is in alice's Household, so a statement filtered on household_id
# alone would rewrite him; dave is in another Household. Neither changes.
- name: user settings - a patch leaves the other members and Households alone
  issue: "119"
  given:
    - sql: INSERT INTO households (id, household_display_name) VALUES ('0192f0a0-0000-7000-8000-000000000002', 'Another Household')
    - sql: INSERT INTO users (id, household_id, email, user_display_name) VALUES ('0192f0a0-0000-7000-8000-0000000000d1', '0192f0a0-0000-7000-8000-000000000002', 'dave@example.com', 'Dave')
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request:
    method: PATCH
    path: /me
    headers:
      Content-Type: application/json
    body: '{"user_display_name":"Taken over","locale":"id-ID","time_zone":"Asia/Makassar"}'
  expect:
    status: 200
    rows:
      - sql: SELECT email, user_display_name, locale, time_zone FROM users WHERE id <> '0192f0a0-0000-7000-8000-0000000000a1' ORDER BY email
        rows:
          - {email: bob@example.com, user_display_name: Bob, locale: en-GB, time_zone: Asia/Jakarta}
          - {email: carol@example.com, user_display_name: Carol, locale: en-GB, time_zone: Asia/Jakarta}
          - {email: dave@example.com, user_display_name: Dave, locale: en-GB, time_zone: Asia/Jakarta}
      - sql: SELECT household_display_name FROM households ORDER BY 1
        rows: [{household_display_name: Another Household}, {household_display_name: Conformance Household}]

# Every refusal is a 400 and writes nothing. The rule is the one named in the
# envelope; the rows prove the row is as it was.
- name: user settings - a time zone the server does not know is refused
  issue: "119"
  given: *signed-in
  request: &patch-zone-mars
    method: PATCH
    path: /me
    headers:
      Content-Type: application/json
    body: '{"time_zone":"Mars/Base"}'
  expect:
    status: 400
    body_json: {code: VALIDATION, args: {field: time_zone, rule: timezone}}
    cookies: {}
    rows: &alice-unchanged
      - sql: SELECT user_display_name, locale, time_zone FROM users WHERE id = '0192f0a0-0000-7000-8000-0000000000a1'
        rows: [{user_display_name: Alice, locale: en-GB, time_zone: Asia/Jakarta}]


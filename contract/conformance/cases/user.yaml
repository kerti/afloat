# PATCH /me (#119): the User's own settings, the §4 merge convention again
# (BOOTSTRAP.md §4): a property left out is unchanged, an unknown property is
# INVALID_JSON_BODY, `{}` is a valid no-op, the answer is the whole Me, last
# write wins per field.
#
# The User is always the caller's own (the session's, never the request's), so
# there is no id to forge. `email` and the password are not properties of this
# resource: each needs the current password and has an operation of its own
# (change-email.yaml, change-password.yaml), so a body naming either is
# INVALID_JSON_BODY, which is how a client learns they are not profile fields.
#
# fixtures/seed.sql holds alice (the caller), bob (same Household, no
# credential) and carol (soft-deleted); a case that proves a User in another
# Household is untouched adds one in `given:`. `rows:` read the columns,
# because a response can be right while the row behind it is not.
#
# Under an outage the session itself cannot be read, which the session
# middleware answers 500 with the cookie left alone (#27); it never reaches the
# handler, whose own 500s (a failing UPDATE, a soft-deleted User) the backend's
# suite covers.

- name: user settings - patch the name, trimmed
  issue: "119"
  given: &signed-in
    - request:
        method: POST
        path: /auth/local/login
        headers:
          Content-Type: application/json
        body: '{"email":"alice@example.com","password":"conformance-correct-horse"}'
      status: 204
  request:
    method: PATCH
    path: /me
    headers:
      Content-Type: application/json
    body: '{"user_display_name":"  Dewi Putri \t"}'
  expect:
    status: 200
    headers:
      Content-Type: application/json
    body_json: &alice-renamed
      id: 0192f0a0-0000-7000-8000-0000000000a1
      email: alice@example.com
      user_display_name: Dewi Putri
      locale: en-GB
      time_zone: Asia/Jakarta
      household: &the-household
        id: 0192f0a0-0000-7000-8000-000000000001
        household_display_name: Conformance Household
        reporting_currency: IDR
        period_start_day: 1
        day_starts_at: "04:00"
        allowance_mode: adaptive
    cookies: {}
    rows:
      - sql: SELECT user_display_name, locale, time_zone, email FROM users WHERE id = '0192f0a0-0000-7000-8000-0000000000a1'
        rows: [{user_display_name: Dewi Putri, locale: en-GB, time_zone: Asia/Jakarta, email: alice@example.com}]


# Request-body validation on POST /auth/local/login (#18, #21; merged in
# #51). The ruling: a body that cannot be decoded into the request type is
# INVALID_JSON_BODY with no args, whatever else is wrong with it; otherwise the
# first failure by (field, rule) order is VALIDATION with {field, rule}.
#
# A sample, not the whole table: each backend's own suite carries every row
# (Go login_validation_test.go, Kotlin LoginSpec). What the harness adds is the
# real server in front of each - Tomcat and net/http, not MockMvc and
# httptest - and the rows. No refusal here burns backoff: a body that never
# named a credential is not a failed login.

- name: validation - email absent is email/required
  issue: "21"
  request:
    method: POST
    path: /auth/local/login
    headers:
      Content-Type: application/json
    body: '{"password":"a valid password"}'
  expect:
    status: 400
    body_json: {code: VALIDATION, args: {field: email, rule: required}}
    cookies: {}
    rows: &no-attempts
      - sql: SELECT count(*)::int AS n FROM login_attempts
        rows: [{n: 0}]


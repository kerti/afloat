# The permitted-difference list: response headers the two backends may differ
# on. Milestone "Base parity" axis 1 is "identical observable responses ... plus
# a documented and tested list of permitted differences" - this is that list, in
# the form the runner enforces. README.md is the prose; this is the enforcement,
# so the two cannot drift apart.
#
# Every entry needs `why`. An entry that encodes a DECISION also needs `issue`,
# and `provisional: true` marks one that exists only because its decision has
# not landed - the runner prints those on every run, so the list cannot quietly
# calcify into "the backends differ and nobody minds".
#
# Adding a header here to make a failing run go green, without an issue behind
# it, is hiding a divergence rather than ruling on one.

- header: Date
  why: >
    A property of HTTP, not of either backend: the value is the instant the
    response was generated, and the two responses are generated milliseconds
    apart. No decision to make.

- header: Content-Length
  why: >
    Framing, not content. A backend that chunks where the other sets a length
    is answering the same thing; the body itself is compared byte for byte
    regardless, so nothing is lost by exempting the header.

- header: X-Request-Id
  issue: "26"
  why: >
    Both backends send it on every response (#26), but a minted id is random,
    so two answers never agree on its value. What IS deterministic - an inbound
    id sanitised to [A-Za-z0-9_-] and cut to 64 - is pinned per backend by
    cases/request-id.yaml, which asserts the value under expected/<backend>,
    where this entry does not reach.

# ---------------------------------------------------------------------------
# Case-scoped - apply only to the cases that cite them under `permit:`, for a
# difference that is right on those answers and would be a bug on any other.
# Always a ruling, so always an issue.
# ---------------------------------------------------------------------------

- name: malformed-path-connector-400
  issue: "64"
  status: true
  headers:
    [
      Content-Type,
      Cache-Control,
      Content-Language,
      Expires,
      Pragma,
      X-Content-Type-Options,
      X-Frame-Options,
      X-Xss-Protection,
    ]
  body: true
  why: >
    A literal backslash, `%00` or invalid UTF-8 in the path: Tomcat's connector
    refuses each with its own HTML 400 before Spring Security's firewall, or
    any filter - including HeaderWriterFilter, which is why none of Kotlin's
    usual security headers or securityHeaders' Go equivalent reach this answer
    at all - ever sees the request (TomcatConfiguration has no pass-through
    for these three, unlike the `%2F`/`%5C` it does relay - #56); Go's chi
    router simply finds no route and answers its bare 404, WITH its usual
    header set, since that comes from middleware ahead of routing. Ruled a
    permitted difference rather than a custom `ErrorReportValve`: no client
    sends these shapes, nothing reaches a handler on either backend, and a
    valve would need maintaining across every Tomcat upgrade for a difference
    no caller can trigger by accident.

- name: unmatched-path-404
  issue: "24"
  headers: [Content-Type]
  body: true
  why: >
    Each backend answers an unregistered path with its framework's own 404 and
    keeps it: Go's net/http sends `404 page not found\n` as text/plain; Spring
    sends an empty body and no Content-Type. #24 requires a disabled route to be
    indistinguishable from an unregistered one ON THE SAME BACKEND, which the
    citing cases pin with `same_as`; it does not require the two backends'
    404s to match. Neither is the error envelope, so the frontend must treat a
    404 by its status alone and never read a non-envelope body - both then
    land on the same path. Revisit if a 404 ever needs to carry a code.

# ---------------------------------------------------------------------------
# Columns - left out of the persisted-state comparison on every case. For a
# value neither backend can reproduce from the other's; every other column of
# every Afloat table is compared.
# ---------------------------------------------------------------------------

- column: sessions.id
  why: >
    The SHA-256 of a session token each backend mints at random, so two
    backends never write the same one. That it is a 64-character hex digest of
    the cookie's value, never the value itself, is each backend's own suite's
    to pin.

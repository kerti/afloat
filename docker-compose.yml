# One Postgres instance, one database, `afloat` (BOOTSTRAP.md §3).
#
# Service names are bare (§1: a per-file namespace, nothing to disambiguate
# from).
#
#   docker compose up -d          # Postgres
#   make db-up / db-reset / db-down

name: afloat

services:
  postgres:
    image: postgres:18-alpine
    # 5184, not 5432: a machine already running Postgres for something else
    # should not have to stop it to work on Afloat. See BOOTSTRAP.md §1 for why
    # this number and not a higher one — anything above 32767 lands in the
    # ephemeral range and fails to bind at random. Override with AFLOAT_DB_PORT.
    ports:
      - "${AFLOAT_DB_PORT:-5184}:5432"
    environment:
      POSTGRES_USER: "${AFLOAT_DB_USER:-afloat}"
      POSTGRES_PASSWORD: "${AFLOAT_DB_PASSWORD:-afloat}"
      POSTGRES_DB: afloat
    volumes:
      # Mounted at /var/lib/postgresql, NOT .../data. Postgres 18 changed the
      # recommended layout so the data directory is a subdirectory of the mount,
      # which is what lets `pg_upgrade --link` work later without crossing a
      # mount boundary. Mounting the old path makes the 18 image refuse to start.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Names the user explicitly: pg_isready defaults to the OS user (root in
      # the container), which is not a Postgres role here and reports failure.
      test: ["CMD-SHELL", "pg_isready -U ${AFLOAT_DB_USER:-afloat} -d afloat"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:

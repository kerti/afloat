# One Postgres instance, two databases (BOOTSTRAP.md §3): afloat_go and
# afloat_kotlin. Never one shared schema — two migration ledgers over one schema
# is a corruption path, and parity is proven by contract conformance rather than
# by sharing rows.
#
# Service names are bare (§1: a per-file namespace, nothing to disambiguate
# from); the images they will build are afloat-go and afloat-kotlin.
#
# Profiles: `postgres` is profile-less, so it starts for every invocation. The
# backends sit behind `go` and `kotlin` profiles and do not exist yet — they land
# at §11 steps 5 and 6. Until then:
#
#   docker compose up -d          # Postgres only
#   make db-up / db-reset / db-down

name: afloat

services:
  postgres:
    image: postgres:18-alpine
    # Not 5432: a developer machine that already runs Postgres for something
    # else should not have to stop it to work on Afloat. Override with
    # AFLOAT_DB_PORT if 55432 is also taken.
    ports:
      - "${AFLOAT_DB_PORT:-55432}:5432"
    environment:
      POSTGRES_USER: "${AFLOAT_DB_USER:-afloat}"
      POSTGRES_PASSWORD: "${AFLOAT_DB_PASSWORD:-afloat}"
      # POSTGRES_DB creates exactly one database; the second is created by the
      # init script below. Named for the Go backend because it is the canonical
      # implementation (§2).
      POSTGRES_DB: afloat_go
    volumes:
      # Mounted at /var/lib/postgresql, NOT .../data. Postgres 18 changed the
      # recommended layout so the data directory is a subdirectory of the mount,
      # which is what lets `pg_upgrade --link` work later without crossing a
      # mount boundary. Mounting the old path makes the 18 image refuse to start.
      - postgres-data:/var/lib/postgresql
      # Runs once, on an empty data directory only. If afloat_kotlin is ever
      # missing after a config change, the volume already exists and this never
      # re-runs — `make db-reset` is the fix, not a restart.
      - ./db/init/01-create-kotlin-database.sh:/docker-entrypoint-initdb.d/01-create-kotlin-database.sh:ro
    healthcheck:
      # Names the user explicitly: pg_isready defaults to the OS user (root in
      # the container), which is not a Postgres role here and reports failure.
      test: ["CMD-SHELL", "pg_isready -U ${AFLOAT_DB_USER:-afloat} -d afloat_go"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
